name: Changelog upload
description: >
  Uploads changelog entries to the private S3 bucket
  (elastic-docs-v3-changelog-bundles-private) using docs-builder's incremental
  upload. Before uploading, looks up merged PRs for the pushed commit and, for
  each merged fork PR, regenerates the changelog entry from the live PR record
  using `docs-builder changelog add --prs <N>`, so fork PRs (which can't commit
  to their own branch) still produce an entry on merge. A scrubber Lambda
  mirrors sanitized copies to the public CDN bucket. Intended to run on push
  to the default branch (main/master). Only files whose content has changed
  are transferred.

inputs:
  config:
    description: 'Path to changelog.yml configuration file (repo-relative, no ".." or absolute paths)'
    default: 'docs/changelog.yml'
  github-token:
    description: 'GitHub token (used by docs-builder setup and the GitHub API lookups). Use the default GITHUB_TOKEN; do not substitute a broader PAT.'
    default: '${{ github.token }}'
  aws-account-id:
    description: 'The AWS account ID. Only override if OIDC trust and IAM roles have been provisioned for the target account.'
    default: '197730964718'

runs:
  using: composite
  steps:
    - name: Verify push to default branch
      shell: bash
      env:
        REF: ${{ github.ref }}
      run: |
        if [[ "$REF" != "refs/heads/main" && "$REF" != "refs/heads/master" ]]; then
          echo "::error::changelog upload must run on a push to main or master (got $REF)"
          exit 1
        fi

    - name: Validate config path
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        if [[ "$CONFIG" == /* ]]; then
          echo "::error::config path must be relative, not absolute: ${CONFIG}"
          exit 1
        fi
        if [[ "$CONFIG" == *..* ]]; then
          echo "::error::config path must not contain '..': ${CONFIG}"
          exit 1
        fi
        if [[ "$CONFIG" == *$'\n'* || "$CONFIG" == *$'\r'* ]]; then
          echo "::error::config path must not contain newlines"
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup docs-builder
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: edge
        github-token: ${{ inputs.github-token }}

    - name: Add changelog entries for merged fork PRs
      shell: bash
      env:
        PUSHED_SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        CONFIG: ${{ inputs.config }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        # Look up PRs associated with the pushed commit. The
        # `/commits/{sha}/pulls` endpoint returns at most one page in
        # practice (a single commit is associated with very few PRs),
        # so we ask for the max per_page and skip `--paginate`. Dropping
        # `--paginate` sidesteps gh CLI's "unexpected end of JSON input"
        # error which can surface when it parses a stray empty next-page
        # response, and running gh and jq as separate processes makes a
        # real API failure surface with gh's own stderr rather than as
        # an opaque JSON parse error.
        pulls_json=$(gh api "repos/${REPO}/commits/${PUSHED_SHA}/pulls?per_page=100")
        fork_prs=$(printf '%s' "$pulls_json" | jq -r '
          .[]
          | select(.merged_at != null)
          | select(.head.repo.full_name != .base.repo.full_name)
          | .number
        ')

        if [[ -z "$fork_prs" ]]; then
          echo "No merged fork PRs associated with ${PUSHED_SHA}; nothing to add."
          exit 0
        fi

        echo "Found merged fork PR(s) for ${PUSHED_SHA}:"
        echo "$fork_prs"

        while IFS= read -r pr; do
          [[ -z "$pr" ]] && continue
          # Defense in depth: the GitHub API only returns digits for PR
          # numbers, but assert it before splicing into the CLI invocation.
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::Refusing non-numeric PR identifier from API: ${pr}"
            exit 1
          fi
          echo "::group::PR #${pr}"
          docs-builder changelog add \
            --concise \
            --use-pr-number \
            --config "$CONFIG" \
            --owner "$OWNER" \
            --repo "$REPO_NAME" \
            --prs "$pr"
          echo "::endgroup::"
        done <<< "$fork_prs"

    - name: Authenticate with AWS
      uses: elastic/docs-actions/aws/auth@v1
      with:
        aws_account_id: ${{ inputs.aws-account-id }}
        aws_role_name_prefix: elastic-docs-v3-changelog-

    - name: Upload changelogs
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        REPO_NAME: ${{ github.event.repository.name }}
        OWNER: ${{ github.repository_owner }}
      run: |
        docs-builder changelog upload \
          --artifact-type changelog \
          --target s3 \
          --s3-bucket-name elastic-docs-v3-changelog-bundles-private \
          --config "$CONFIG" \
          --repo "$REPO_NAME" \
          --owner "$OWNER"
