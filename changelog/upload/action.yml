name: Changelog upload
description: >
  Uploads changelog entries to the private S3 bucket
  (elastic-docs-v3-changelog-bundles-private) using docs-builder's incremental
  upload. A scrubber Lambda mirrors sanitized copies to the public CDN bucket.
  Entries are scoped per branch (changelog/{org}/{repo}/{branch}/...), so this
  can run on a push to any branch (main/master or a release branch). Only files
  whose content has changed are transferred.

inputs:
  config:
    description: 'Path to changelog.yml configuration file (repo-relative, no ".." or absolute paths)'
    default: 'docs/changelog.yml'
  artifact-type:
    description: >
      Comma-separated artifact types to upload (e.g. changelog, amend, or changelog,amend).
      Defaults to 'changelog'. Pass 'changelog,amend' to also upload amend entries.
    default: 'changelog'
  branch:
    description: 'Branch the changelog entries are published under (changelog/{org}/{repo}/{branch}/...). Defaults to the pushed branch.'
    default: '${{ github.ref_name }}'
  github-token:
    description: 'GitHub token (used by docs-builder setup and the GitHub API lookups). Use the default GITHUB_TOKEN; do not substitute a broader PAT.'
    default: '${{ github.token }}'
  aws-account-id:
    description: 'The AWS account ID. Only override if OIDC trust and IAM roles have been provisioned for the target account.'
    default: '197730964718'

runs:
  using: composite
  steps:
    - name: Verify branch push
      shell: bash
      env:
        REF: ${{ github.ref }}
      run: |
        if [[ "$REF" != refs/heads/* ]]; then
          echo "::error::changelog upload must run on a branch push (got $REF)"
          exit 1
        fi

    - name: Validate inputs
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        BRANCH: ${{ inputs.branch }}
      run: |
        if [[ "$CONFIG" == /* ]]; then
          echo "::error::config path must be relative, not absolute: ${CONFIG}"
          exit 1
        fi
        if [[ "$CONFIG" == *..* ]]; then
          echo "::error::config path must not contain '..': ${CONFIG}"
          exit 1
        fi
        if [[ "$CONFIG" == *$'\n'* || "$CONFIG" == *$'\r'* ]]; then
          echo "::error::config path must not contain newlines"
          exit 1
        fi
        if [[ -z "$BRANCH" ]]; then
          echo "::error::branch must not be empty"
          exit 1
        fi
        if [[ "$BRANCH" == *$'\n'* || "$BRANCH" == *$'\r'* ]]; then
          echo "::error::branch must not contain newlines"
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup docs-builder
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: edge
        github-token: ${{ inputs.github-token }}

    - name: Authenticate with AWS
      uses: elastic/docs-actions/aws/auth@v1
      with:
        aws_account_id: ${{ inputs.aws-account-id }}
        aws_role_name_prefix: elastic-docs-v3-changelog-

    - name: Upload changelogs
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ARTIFACT_TYPE: ${{ inputs.artifact-type }}
        REPO_NAME: ${{ github.event.repository.name }}
        OWNER: ${{ github.repository_owner }}
        BRANCH: ${{ inputs.branch }}
      run: |
        docs-builder changelog upload \
          --artifact-type "$ARTIFACT_TYPE" \
          --target s3 \
          --s3-bucket-name elastic-docs-v3-changelog-bundles-private \
          --config "$CONFIG" \
          --repo "$REPO_NAME" \
          --owner "$OWNER" \
          --branch "$BRANCH"
