name: Changelog bundle upload
description: >
  Downloads a changelog bundle artifact and uploads it to the private S3 bucket. A scrubber Lambda mirrors
  sanitized copies to the public CDN bucket. Uses OIDC for AWS authentication
  and docs-builder's incremental upload.

inputs:
  output:
    description: >
      Output file path for the bundle, relative to the repo root
      (e.g. docs/releases/v9.2.0.yaml). Must match the path used
      by the bundle-create action.
    required: true
  config:
    description: 'Path to changelog.yml configuration file (repo-relative, no ".." or absolute paths)'
    default: 'docs/changelog.yml'
  artifact-name:
    description: 'Name of the artifact uploaded by bundle-create'
    default: 'changelog-bundle'
  docs-builder-version:
    description: >
      docs-builder version to use (e.g. 0.1.100, latest, edge).
      Non-edge versions are attestation-verified by the setup action.
    default: 'edge'
  github-token:
    description: 'GitHub token (used by docs-builder setup). Use the default GITHUB_TOKEN; do not substitute a broader PAT.'
    default: '${{ github.token }}'
  aws-account-id:
    description: 'The AWS account ID. Only override if OIDC trust and IAM roles have been provisioned for the target account.'
    default: '197730964718'
  aws-role-arn:
    description: >
      Optional explicit IAM role ARN to assume for S3 access. When set, the
      role is assumed directly via aws-actions/configure-aws-credentials and
      the aws/auth repo-derived role derivation is skipped. Use this when the
      caller's repo identity should not drive role selection — for example, a
      docs-owned promotion workflow in a private repo that holds a single
      dedicated role scoped to the bundle/* S3 prefix. Must be empty or a
      valid ARN (arn:aws:iam::…:role/…).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
        CONFIG: ${{ inputs.config }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        source "${GITHUB_ACTION_PATH}/../../scripts/validate-inputs.sh"

        if [[ "$OUTPUT" != *.yml && "$OUTPUT" != *.yaml ]]; then
          echo "::error::Output path must end in .yml or .yaml: ${OUTPUT}"
          exit 1
        fi
        validate_path "$OUTPUT" "output"
        validate_path "$CONFIG" "config"

        if [[ ! "$ARTIFACT_NAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
          echo "::error::Artifact name contains disallowed characters: ${ARTIFACT_NAME}"
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Download bundle artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: .bundle-artifact

    - name: Place bundle in output path
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
      run: |
        mkdir -p "$(dirname "$OUTPUT")"
        cp ".bundle-artifact/$(basename "$OUTPUT")" "$OUTPUT"

    - name: Setup docs-builder
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: ${{ inputs.docs-builder-version }}
        github-token: ${{ inputs.github-token }}

    - name: Authenticate with AWS (explicit role)
      if: ${{ inputs.aws-role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
      with:
        aws-region: us-east-1
        role-to-assume: ${{ inputs.aws-role-arn }}

    - name: Authenticate with AWS (repo-derived role)
      if: ${{ inputs.aws-role-arn == '' }}
      uses: elastic/docs-actions/aws/auth@v1
      with:
        aws_account_id: ${{ inputs.aws-account-id }}
        aws_role_name_prefix: elastic-docs-v3-changelog-

    - name: Upload bundle to S3
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        OUTPUT: ${{ inputs.output }}
      run: |
        docs-builder changelog upload \
          --artifact-type bundle \
          --target s3 \
          --s3-bucket-name elastic-docs-v3-changelog-bundles-private \
          --config "$CONFIG" \
          --directory "$(dirname "$OUTPUT")"
