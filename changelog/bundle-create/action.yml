name: Changelog bundle create
description: >
  Checks out the repository, runs docs-builder changelog bundle in Docker
  to generate a fully-resolved bundle file, and uploads the result as an
  artifact. Supports filtering by GitHub release version, Buildkite
  promotion report, or an explicit list of PR URLs/numbers.
  Uses --network none for report and prs modes.

inputs:
  config:
    description: 'Path to changelog.yml configuration file'
    default: 'docs/changelog.yml'
  release-version:
    description: >
      GitHub release tag used as the PR filter source (e.g. v9.2.0).
      Mutually exclusive with report and prs. Requires repo to be set in
      changelog.yml (bundle.repo) or passed via the repo input.
  report:
    description: >
      Buildkite promotion report URL or local file path used as the
      PR filter source. Mutually exclusive with release-version and prs.
      Local paths must be relative to the repo root.
  prs:
    description: >
      Comma-separated PR URLs or numbers, or a path to a newline-delimited
      file. Mutually exclusive with release-version and report.
      Bare numbers require repo/owner to be set in changelog.yml or
      passed via the repo and owner inputs.
  output:
    description: >
      Output file path for the bundle, relative to the repo root
      (e.g. docs/releases/v9.2.0.yaml). Must end in .yml or .yaml.
    required: true
  repo:
    description: >
      GitHub repository name. Falls back to bundle.repo in changelog.yml.
  owner:
    description: >
      GitHub repository owner. Falls back to bundle.owner in changelog.yml,
      then to elastic.
  artifact-name:
    description: 'Name for the uploaded artifact (must match bundle-pr artifact-name)'
    default: 'changelog-bundle'
  github-token:
    description: 'GitHub token (needed for release-version to access GitHub API)'
    default: '${{ github.token }}'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Prepare bundle arguments
      id: prepare
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        RELEASE_VERSION: ${{ inputs.release-version }}
        REPORT: ${{ inputs.report }}
        PRS: ${{ inputs.prs }}
        OUTPUT: ${{ inputs.output }}
        REPO: ${{ inputs.repo }}
        OWNER: ${{ inputs.owner }}
      run: node "${{ github.action_path }}/scripts/generate-bundle.js"

    - name: Generate changelog bundle
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: docker run ${{ steps.prepare.outputs.docker-args }} ghcr.io/elastic/docs-builder:edge ${{ steps.prepare.outputs.bundle-args }}

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
        if-no-files-found: error
        retention-days: 1
