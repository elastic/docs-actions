name: Changelog bundle create
description: >
  Checks out the repository, runs docs-builder changelog bundle in Docker
  to generate a fully-resolved bundle file, and uploads the result as an
  artifact. Supports option-based filtering (release-version, report, prs,
  prs-artifact), profile-based bundling (optionally filtered by a report or
  a PR-list artifact), and gh-release mode (creates changelogs from a
  GitHub release). Uses --network none where possible.

inputs:
  mode:
    description: >
      Operation mode: 'bundle' (default) runs changelog bundle,
      'gh-release' runs changelog gh-release to create changelogs
      from a GitHub release. In gh-release mode, repo and version
      are required; most other inputs are ignored.
    default: 'bundle'
  config:
    description: 'Path to changelog.yml configuration file'
    default: 'docs/changelog.yml'
  profile:
    description: >
      Bundle profile name from bundle.profiles in changelog.yml.
      Mutually exclusive with release-version and prs. When set,
      all paths and output settings come from the config; a report
      or prs-artifact may supply the filter source.
  version:
    description: >
      Version string for profile mode (e.g. 9.2.0, 2026-03).
      Used for {version} substitution in profile patterns.
      Only valid with profile.
  release-version:
    description: >
      GitHub release tag used as the PR filter source (e.g. v9.2.0).
      Mutually exclusive with profile, report, and prs.
  report:
    description: >
      Buildkite promotion report URL or local file path used as the
      PR filter source. In option mode, mutually exclusive with
      release-version and prs. In profile mode, passed as a positional
      argument. Local paths must be relative to the repo root.
  prs:
    description: >
      Comma-separated PR URLs or numbers, or a path to a newline-delimited
      file committed to the repository. Mutually exclusive with profile,
      release-version, report, and prs-artifact. Bare numbers require
      repo/owner to be set in changelog.yml or inputs.
  prs-artifact:
    description: >
      Name of a workflow artifact, uploaded earlier in the same run,
      containing a single newline-delimited file of fully-qualified GitHub
      PR or issue URLs (one kind per file, no mixing) to use as the bundle
      filter source. Unlike prs, this works in profile mode (passed as the
      positional filter argument; version is then required) as well as
      option mode (passed via --prs or --issues based on the detected URL
      kind), and supports PR lists generated at release time. Mutually
      exclusive with prs, report, and release-version.
  output:
    description: >
      Output file path for the bundle, relative to the repo root.
      Optional in both modes. When not provided, docs-builder writes
      to the path determined by the config (bundle.output_directory)
      and the plan resolves the generated file path automatically.
  repo:
    description: >
      GitHub repository name. Falls back to bundle.repo in changelog.yml.
  owner:
    description: >
      GitHub repository owner. Falls back to bundle.owner in changelog.yml,
      then to elastic.
  docs-builder-version:
    description: >
      docs-builder version to use (e.g. 0.1.100, latest, edge).
      Non-edge versions are attestation-verified by the setup action.
    default: 'edge'
  artifact-name:
    description: 'Name for the uploaded artifact (must match bundle-pr artifact-name)'
    default: 'changelog-bundle'
  strip-title-prefix:
    description: 'Remove [Prefix]: from PR titles (gh-release mode only)'
    default: 'false'
  github-token:
    description: 'GitHub token (needed for release-version and source: github_release profiles)'
    default: '${{ github.token }}'

outputs:
  output:
    description: 'Resolved output file path for the bundle'
    value: ${{ steps.plan.outputs.output_path || steps.gh-release-output.outputs.output_path }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Validate inputs
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CONFIG: ${{ inputs.config }}
        PROFILE: ${{ inputs.profile }}
        VERSION: ${{ inputs.version }}
        RELEASE_VERSION: ${{ inputs.release-version }}
        OUTPUT: ${{ inputs.output }}
        REPORT: ${{ inputs.report }}
        PRS: ${{ inputs.prs }}
        PRS_ARTIFACT: ${{ inputs.prs-artifact }}
        REPO: ${{ inputs.repo }}
        OWNER: ${{ inputs.owner }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        if [[ "$MODE" != "bundle" && "$MODE" != "gh-release" ]]; then
          echo "::error::mode must be 'bundle' or 'gh-release', got: ${MODE}"
          exit 1
        fi

        if [[ "$MODE" == "gh-release" && -z "$REPO" ]]; then
          echo "::error::repo is required in gh-release mode"
          exit 1
        fi

        if [ -n "$PRS_ARTIFACT" ]; then
          if [ -n "$PRS" ]; then
            echo "::error::prs and prs-artifact are mutually exclusive"; exit 1
          fi
          if [ -n "$REPORT" ]; then
            echo "::error::report and prs-artifact are mutually exclusive"; exit 1
          fi
          if [ -n "$RELEASE_VERSION" ]; then
            echo "::error::release-version and prs-artifact are mutually exclusive"; exit 1
          fi
          # Without a version the URL list file becomes the second positional
          # argument: the --plan step would substitute the file path into
          # {version} placeholders while the real run substitutes "unknown",
          # so the planned output path diverges from the generated one.
          if [ -n "$PROFILE" ] && [ -z "$VERSION" ]; then
            echo "::error::version is required when prs-artifact is used with profile ({version}/{lifecycle} substitution and the resolved output path depend on it)"; exit 1
          fi
        fi

        # Profile mode derives all filters from the config. docs-builder
        # rejects --prs/--release-version alongside a profile, so the action
        # must fail here rather than silently drop the inputs and publish a
        # bundle filtered by the profile alone.
        if [[ "$MODE" == "bundle" && -n "$PROFILE" ]]; then
          if [ -n "$PRS" ]; then
            echo "::error::profile and prs are mutually exclusive. Use prs-artifact to filter a profile bundle by a PR list"; exit 1
          fi
          if [ -n "$RELEASE_VERSION" ]; then
            echo "::error::profile and release-version are mutually exclusive. Configure 'source: github_release' on the profile instead"; exit 1
          fi
        fi

        source "${GITHUB_ACTION_PATH}/../../scripts/validate-inputs.sh"

        validate_path "$CONFIG" "config"
        validate_path "$OUTPUT" "output"

        if [ -n "$REPORT" ] && [[ "$REPORT" != https://* ]] && [[ "$REPORT" != http://* ]]; then
          validate_path "$REPORT" "report"
        fi
        if [ -n "$PRS" ] && { [[ "$PRS" == */* ]] || [[ "$PRS" == *.txt ]]; }; then
          validate_path "$PRS" "prs"
        fi

        validate_identifier "$PROFILE" "profile" '^[a-zA-Z0-9._-]+$'
        validate_identifier "$VERSION" "version" '^[a-zA-Z0-9._+-]+$'
        validate_identifier "$RELEASE_VERSION" "release-version" '^[a-zA-Z0-9._+-]+$'
        validate_identifier "$REPO" "repo" '^[a-zA-Z0-9._-]+$'
        validate_identifier "$OWNER" "owner" '^[a-zA-Z0-9._-]+$'
        validate_identifier "$ARTIFACT_NAME" "artifact-name" '^[a-zA-Z0-9._-]+$'
        validate_identifier "$PRS_ARTIFACT" "prs-artifact" '^[a-zA-Z0-9._-]+$'

        if [ -n "$REPORT" ] && [[ "$REPORT" == http://* ]]; then
          echo "::error::Report URL must use HTTPS: ${REPORT}"; exit 1
        fi

    - name: Download PR list artifact
      if: inputs.mode == 'bundle' && inputs.prs-artifact != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.prs-artifact }}
        path: .bundle-prs

    # The artifact must contain exactly one newline-delimited URL list file in
    # which every non-empty line is a fully-qualified GitHub PR URL or issue
    # URL (one kind per file). The kind decides the option-mode flag
    # (--prs vs --issues). Exhaustive anchored matching matters here: the
    # option-mode docs-builder loaders accept any http(s) line, so a partially
    # valid file would otherwise produce a silently partial bundle.
    - name: Resolve PR list file
      if: inputs.mode == 'bundle' && inputs.prs-artifact != ''
      id: prs-file
      shell: bash
      run: |
        if find .bundle-prs -type l | grep -q .; then
          echo "::error::prs-artifact contains symlinks — refusing to use it"
          exit 1
        fi
        FILE_COUNT=$(find .bundle-prs -maxdepth 1 -type f | wc -l)
        if [ "$FILE_COUNT" -ne 1 ]; then
          echo "::error::prs-artifact must contain exactly one newline-delimited URL list file (found ${FILE_COUNT})"
          exit 1
        fi
        PRS_FILE=$(find .bundle-prs -maxdepth 1 -type f)

        PR_COUNT=$(grep -icE '^[[:space:]]*https://github\.com/[^/]+/[^/]+/pull/[0-9]+/?[[:space:]]*$' "$PRS_FILE" || true)
        ISSUE_COUNT=$(grep -icE '^[[:space:]]*https://github\.com/[^/]+/[^/]+/issues/[0-9]+/?[[:space:]]*$' "$PRS_FILE" || true)
        TOTAL_COUNT=$(grep -cvE '^[[:space:]]*$' "$PRS_FILE" || true)
        if [ "$PR_COUNT" -gt 0 ] && [ "$ISSUE_COUNT" -gt 0 ]; then
          echo "::error::prs-artifact file must contain only pull request URLs or only issue URLs, not a mix"
          exit 1
        fi
        if [ "$TOTAL_COUNT" -eq 0 ] || [ $((PR_COUNT + ISSUE_COUNT)) -ne "$TOTAL_COUNT" ]; then
          echo "::error::every non-empty line in the prs-artifact file must be a fully-qualified GitHub PR or issue URL (matched ${PR_COUNT} PR and ${ISSUE_COUNT} issue URLs out of ${TOTAL_COUNT} non-empty lines)"
          exit 1
        fi
        KIND=prs
        [ "$ISSUE_COUNT" -gt 0 ] && KIND=issues

        echo "path=${PRS_FILE}" >> "$GITHUB_OUTPUT"
        echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
        echo "::notice title=PR list::Using ${PRS_FILE} (${KIND}) as the bundle filter source"

    - name: Setup docs-builder
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: ${{ inputs.docs-builder-version }}
        github-token: ${{ inputs.github-token }}

    - name: Resolve bundle plan
      if: inputs.mode == 'bundle'
      id: plan
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        PROFILE: ${{ inputs.profile }}
        VERSION: ${{ inputs.version }}
        RELEASE_VERSION: ${{ inputs.release-version }}
        REPORT: ${{ inputs.report }}
        PRS: ${{ inputs.prs }}
        PRS_FILE: ${{ steps.prs-file.outputs.path }}
        PRS_KIND: ${{ steps.prs-file.outputs.kind }}
        OUTPUT: ${{ inputs.output }}
        REPO: ${{ inputs.repo }}
        OWNER: ${{ inputs.owner }}
      run: |
        ARGS=()
        ARGS+=(changelog bundle --plan)
        if [ -n "$PROFILE" ]; then
          ARGS+=("$PROFILE")
          [ -n "$VERSION" ] && ARGS+=("$VERSION")
          [ -n "$REPORT" ] && ARGS+=("$REPORT")
          [ -n "$PRS_FILE" ] && ARGS+=("$PRS_FILE")
        else
          ARGS+=(--config "$CONFIG" --resolve)
          [ -n "$RELEASE_VERSION" ] && ARGS+=(--release-version "$RELEASE_VERSION")
          [ -n "$REPORT" ] && ARGS+=(--report "$REPORT")
          [ -n "$PRS" ] && ARGS+=(--prs "$PRS")
          if [ -n "$PRS_FILE" ]; then
            [ "$PRS_KIND" = "issues" ] && ARGS+=(--issues "$PRS_FILE") || ARGS+=(--prs "$PRS_FILE")
          fi
          [ -n "$OUTPUT" ] && ARGS+=(--output "$OUTPUT")
          [ -n "$REPO" ] && ARGS+=(--repo "$REPO")
          [ -n "$OWNER" ] && ARGS+=(--owner "$OWNER")
        fi

        docs-builder "${ARGS[@]}"

    - name: Verify plan output
      if: inputs.mode == 'bundle'
      shell: bash
      env:
        OUTPUT_PATH: ${{ steps.plan.outputs.output_path }}
      run: |
        if [ -z "$OUTPUT_PATH" ]; then
          echo "::error::Plan did not resolve an output path. Set 'output' input or configure bundle.output_directory in changelog.yml."
          exit 1
        fi

    - name: Download report
      if: inputs.mode == 'bundle' && inputs.report != '' && startsWith(inputs.report, 'https://')
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
      run: curl --fail --silent --show-error --location --max-redirs 5 --max-time 30 "$REPORT" -o .bundle-report.html

    - name: Pull and pin Docker image
      id: docker-image
      shell: bash
      env:
        BUILDER_VERSION: ${{ inputs.docs-builder-version }}
      run: |
        IMAGE="ghcr.io/elastic/docs-builder:${BUILDER_VERSION}"
        docker pull "$IMAGE"
        DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        echo "::notice title=Docker image digest::${DIGEST}"

    - name: Generate changelog bundle
      if: inputs.mode == 'bundle'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NEEDS_NETWORK: ${{ steps.plan.outputs.needs_network }}
        NEEDS_GITHUB_TOKEN: ${{ steps.plan.outputs.needs_github_token }}
        IMAGE_DIGEST: ${{ steps.docker-image.outputs.digest }}
        CONFIG: ${{ inputs.config }}
        PROFILE: ${{ inputs.profile }}
        VERSION: ${{ inputs.version }}
        RELEASE_VERSION: ${{ inputs.release-version }}
        REPORT: ${{ inputs.report }}
        PRS: ${{ inputs.prs }}
        PRS_FILE: ${{ steps.prs-file.outputs.path }}
        PRS_KIND: ${{ steps.prs-file.outputs.kind }}
        OUTPUT: ${{ inputs.output }}
        REPO: ${{ inputs.repo }}
        OWNER: ${{ inputs.owner }}
      run: |
        DOCKER_ARGS=(--rm -v "${PWD}:/github/workspace" -w /github/workspace)

        if [ "$NEEDS_NETWORK" = "true" ]; then
          [ "$NEEDS_GITHUB_TOKEN" = "true" ] && DOCKER_ARGS+=(-e GITHUB_TOKEN)
        else
          DOCKER_ARGS+=(--network none)
        fi

        resolve_report() {
          if [ -n "$1" ] && [[ "$1" == https://* ]]; then
            echo ".bundle-report.html"
          else
            echo "$1"
          fi
        }

        BUNDLE_ARGS=()
        BUNDLE_ARGS+=(changelog bundle)
        if [ -n "$PROFILE" ]; then
          BUNDLE_ARGS+=("$PROFILE")
          [ -n "$VERSION" ] && BUNDLE_ARGS+=("$VERSION")
          [ -n "$REPORT" ] && BUNDLE_ARGS+=("$(resolve_report "$REPORT")")
          [ -n "$PRS_FILE" ] && BUNDLE_ARGS+=("$PRS_FILE")
        else
          BUNDLE_ARGS+=(--config "$CONFIG" --resolve)
          [ -n "$RELEASE_VERSION" ] && BUNDLE_ARGS+=(--release-version "$RELEASE_VERSION")
          [ -n "$REPORT" ] && BUNDLE_ARGS+=(--report "$(resolve_report "$REPORT")")
          [ -n "$PRS" ] && BUNDLE_ARGS+=(--prs "$PRS")
          if [ -n "$PRS_FILE" ]; then
            [ "$PRS_KIND" = "issues" ] && BUNDLE_ARGS+=(--issues "$PRS_FILE") || BUNDLE_ARGS+=(--prs "$PRS_FILE")
          fi
          [ -n "$OUTPUT" ] && BUNDLE_ARGS+=(--output "$OUTPUT")
          [ -n "$REPO" ] && BUNDLE_ARGS+=(--repo "$REPO")
          [ -n "$OWNER" ] && BUNDLE_ARGS+=(--owner "$OWNER")
        fi

        docker run "${DOCKER_ARGS[@]}" "$IMAGE_DIGEST" "${BUNDLE_ARGS[@]}"

    - name: Generate changelogs from GitHub release
      if: inputs.mode == 'gh-release'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IMAGE_DIGEST: ${{ steps.docker-image.outputs.digest }}
        CONFIG: ${{ inputs.config }}
        VERSION: ${{ inputs.version }}
        OUTPUT: ${{ inputs.output }}
        REPO: ${{ inputs.repo }}
        OWNER: ${{ inputs.owner }}
        STRIP_TITLE_PREFIX: ${{ inputs.strip-title-prefix }}
      run: |
        DOCKER_ARGS=(--rm -v "${PWD}:/github/workspace" -w /github/workspace -e GITHUB_TOKEN)

        GH_RELEASE_ARGS=(changelog gh-release)

        REPO_ARG="$REPO"
        if [ -n "$OWNER" ]; then
          REPO_ARG="${OWNER}/${REPO}"
        fi
        GH_RELEASE_ARGS+=("$REPO_ARG")

        [ -n "$VERSION" ] && GH_RELEASE_ARGS+=("$VERSION") || GH_RELEASE_ARGS+=("latest")
        [ -n "$CONFIG" ] && GH_RELEASE_ARGS+=(--config "$CONFIG")
        [ -n "$OUTPUT" ] && GH_RELEASE_ARGS+=(--output "$OUTPUT")
        [ "$STRIP_TITLE_PREFIX" = "true" ] && GH_RELEASE_ARGS+=(--strip-title-prefix)

        docker run "${DOCKER_ARGS[@]}" "$IMAGE_DIGEST" "${GH_RELEASE_ARGS[@]}"

    - name: Discover gh-release output
      if: inputs.mode == 'gh-release'
      id: gh-release-output
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
        CONFIG: ${{ inputs.config }}
      run: |
        SEARCH_DIR="${OUTPUT:-docs/releases}"
        if [ -f "$SEARCH_DIR" ]; then
          SEARCH_DIR="$(dirname "$SEARCH_DIR")"
        fi

        BUNDLE_DIR="${SEARCH_DIR}/bundles"
        if [ ! -d "$BUNDLE_DIR" ]; then
          BUNDLE_DIR="$SEARCH_DIR"
        fi

        BUNDLE_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.yaml' -o -name '*.yml' | head -1)
        if [ -z "$BUNDLE_FILE" ]; then
          echo "::error::No bundle file found in ${BUNDLE_DIR}"
          exit 1
        fi
        echo "output_path=${BUNDLE_FILE}" >> "$GITHUB_OUTPUT"
        echo "::notice title=Bundle output::${BUNDLE_FILE}"

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.plan.outputs.output_path || steps.gh-release-output.outputs.output_path }}
        if-no-files-found: error
        retention-days: 1
