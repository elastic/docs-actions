name: Changelog submit / apply
description: >
  Write action that downloads the changelog artifact produced by the evaluate
  action, commits the changelog entry to the PR branch, and uploads a
  changelog-decision artifact for the downstream comment workflow.
  Requires contents:write and pull-requests:write permissions.

inputs:
  github-token:
    description: 'GitHub token with contents:write and pull-requests:write'
    default: '${{ github.token }}'

outputs:
  committed:
    description: 'Whether a changelog was committed (true/false)'
    value: ${{ steps.commit.outputs.committed || 'false' }}

runs:
  using: composite
  steps:
    - name: Download staging artifact
      uses: actions/download-artifact@v8
      with:
        name: changelog-staging
        path: /tmp/changelog-staging

    - name: Setup docs-builder
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: edge
        github-token: ${{ inputs.github-token }}

    - name: Evaluate artifact
      id: meta
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        docs-builder changelog evaluate-artifact \
          --metadata /tmp/changelog-staging/metadata.json \
          --owner "$REPO_OWNER" \
          --repo "$REPO_NAME"

    # Fail closed: even when metadata says should-commit, never commit to a fork
    # PR. The upstream GITHUB_TOKEN cannot push to fork branches and would also
    # land on a detached HEAD (checkout uses head-sha), so a fork push is always
    # the wrong action. This guard codifies that invariant locally rather than
    # trusting upstream correctness.
    - name: Checkout PR branch
      if: steps.meta.outputs.should-commit == 'true' && steps.meta.outputs.is-fork != 'true'
      uses: actions/checkout@v6
      with:
        repository: ${{ steps.meta.outputs.head-repo }}
        ref: ${{ steps.meta.outputs.head-sha }}
        token: ${{ inputs.github-token }}
        persist-credentials: false

    - name: Validate ref names
      if: steps.meta.outputs.should-commit == 'true' && steps.meta.outputs.is-fork != 'true'
      shell: bash
      env:
        HEAD_REF: ${{ steps.meta.outputs.head-ref }}
      run: |
        if [[ ! "$HEAD_REF" =~ ^[a-zA-Z0-9._/+-]+$ ]]; then
          echo "::error::Ref name contains disallowed characters: ${HEAD_REF}"
          exit 1
        fi

    # continue-on-error lets us catch git push failures (branch protection,
    # revoked permissions, etc.) and fall back to posting the changelog as a
    # PR comment in a later step instead of hard-failing the workflow.
    - name: Commit changelog
      if: steps.meta.outputs.should-commit == 'true' && steps.meta.outputs.is-fork != 'true'
      id: commit
      continue-on-error: true
      shell: bash
      env:
        PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
        CHANGELOG_DIR: ${{ steps.meta.outputs.changelog-dir }}
        CHANGELOG_FILENAME: ${{ steps.meta.outputs.changelog-filename }}
        HEAD_REF: ${{ steps.meta.outputs.head-ref }}
        GH_TOKEN: ${{ inputs.github-token }}
        GIT_REPOSITORY: ${{ github.repository }}
      run: |
        GENERATED=$(ls /tmp/changelog-staging/*.yaml 2>/dev/null | head -1)
        if [ -z "$GENERATED" ]; then
          echo "::error::No changelog YAML found in staging directory"
          exit 1
        fi

        if [ -n "$CHANGELOG_FILENAME" ]; then
          TARGET_FILENAME="$CHANGELOG_FILENAME"
        else
          TARGET_FILENAME=$(basename "$GENERATED")
        fi
        CHANGELOG_FILE="$CHANGELOG_DIR/$TARGET_FILENAME"

        if [ -f "$CHANGELOG_FILE" ]; then
          VERB="Update"
        else
          VERB="Add"
        fi

        mkdir -p "$CHANGELOG_DIR"
        cp "$GENERATED" "$CHANGELOG_FILE"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$CHANGELOG_FILE"

        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "committed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "${VERB} changelog for PR #${PR_NUMBER}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GIT_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"
          git remote set-url origin "https://github.com/${GIT_REPOSITORY}.git"
          echo "committed=true" >> "$GITHUB_OUTPUT"
        fi

        echo "changelog-file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"

    - name: Surface commit failure
      if: steps.commit.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Changelog commit step failed; posting the entry as a PR comment only. Same-repository PR entries are not regenerated by the merge-time upload, so resolve the commit failure before merging."

    - name: Record decision and stage comment artifact
      if: always()
      continue-on-error: true
      shell: bash
      env:
        COMMIT_OUTCOME: ${{ steps.commit.outputs.committed == 'true' && 'committed' || steps.commit.outcome == 'failure' && 'failed' || 'none' }}
        COMMITTED_FILE: ${{ steps.commit.outputs.changelog-file }}
      run: |
        mkdir -p .artifacts/changelog-decision
        cp /tmp/changelog-staging/metadata.json .artifacts/changelog-decision/metadata.json

        # Copy the generated YAML so the comment renderer can show it in comment-only mode
        GENERATED=$(ls /tmp/changelog-staging/*.yaml 2>/dev/null | head -1)
        if [ -n "$GENERATED" ]; then
          cp "$GENERATED" .artifacts/changelog-decision/
        fi

        ARGS=(--metadata .artifacts/changelog-decision/metadata.json --commit-outcome "$COMMIT_OUTCOME")
        if [ -n "$COMMITTED_FILE" ]; then
          ARGS+=(--committed-file "$COMMITTED_FILE")
        fi

        docs-builder changelog github-decision "${ARGS[@]}"

    - name: Upload decision artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: changelog-decision
        path: .artifacts/changelog-decision
        retention-days: 1
        if-no-files-found: ignore
