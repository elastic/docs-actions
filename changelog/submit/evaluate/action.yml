name: Changelog submit / evaluate
description: >
  Read-only action that resolves PR context, evaluates whether a changelog
  should be generated, and produces the changelog YAML. Uploads the result
  as an artifact for the apply action to commit or comment.

inputs:
  config:
    description: 'Path to changelog.yml configuration file'
    default: 'docs/changelog.yml'
  strip-title-prefix:
    description: 'Remove [Prefix]: from PR titles'
    default: 'true'
  github-token:
    description: 'GitHub token (contents:read is sufficient)'
    default: '${{ github.token }}'
  comment-only:
    description: 'Post changelog as a PR comment instead of committing to the branch'
    default: 'false'
  is-org-member:
    description: 'Whether the PR author is a verified elastic org member (enables trusted fork checkout)'
    default: 'false'

outputs:
  pr-number:
    description: 'The PR number'
    value: ${{ steps.pr.outputs.number }}
  proceed:
    description: 'Whether a changelog was generated and artifact uploaded'
    value: ${{ steps.upload.outcome == 'success' && 'true' || 'false' }}

runs:
  using: composite
  steps:
    - name: Resolve PR
      id: pr
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const script = require('${{ github.action_path }}/scripts/resolve-pr.js');
          await script({ github, context, core });

    - name: Fetch PR data
      id: pr-data
      if: steps.pr.outputs.number != ''
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const script = require('${{ github.action_path }}/scripts/fetch-pr-data.js');
          await script({ github, context, core });
      env:
        PR_NUMBER: ${{ steps.pr.outputs.number }}

    - name: Resolve commit strategy
      id: strategy
      if: steps.pr-data.outputs.proceed == 'true'
      shell: bash
      env:
        IS_FORK: ${{ steps.pr-data.outputs.is-fork }}
        IS_ORG_MEMBER: ${{ inputs.is-org-member }}
        COMMENT_ONLY: ${{ inputs.comment-only }}
      run: |
        trusted=false
        can_commit=false

        if [[ "$IS_FORK" != "true" ]]; then
          trusted=true
          can_commit=true
        elif [[ "$IS_ORG_MEMBER" == "true" ]]; then
          trusted=true
          echo "::notice::Fork PR — changelog will be posted as a comment. On merge, the upload workflow regenerates the entry from the live PR record (title, labels) and uploads it to S3."
        fi

        if [[ "$COMMENT_ONLY" == "true" ]]; then
          can_commit=false
        fi

        echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"
        echo "can-commit=${can_commit}" >> "$GITHUB_OUTPUT"

    - name: Checkout PR head (same-repo PR)
      if: steps.pr-data.outputs.proceed == 'true' && steps.strategy.outputs.trusted == 'true' && steps.pr-data.outputs.is-fork != 'true'
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.pr-data.outputs.head-sha }}
        token: ${{ inputs.github-token }}
        persist-credentials: false

    - name: Checkout PR head (fork PR via upstream pull-ref mirror)
      # WORKAROUND: We cannot clone the fork repo directly with GITHUB_TOKEN
      # (scoped to the upstream only). GitHub mirrors every PR's head as
      # refs/pull/<N>/head inside the *upstream* repo, so checking out that
      # ref via the upstream gives us the exact PR head SHA without ever
      # touching the fork. Works for both public and private forks.
      if: steps.pr-data.outputs.proceed == 'true' && steps.strategy.outputs.trusted == 'true' && steps.pr-data.outputs.is-fork == 'true'
      uses: actions/checkout@v6
      with:
        ref: refs/pull/${{ steps.pr.outputs.number }}/head
        persist-credentials: false

    - name: Checkout base repo (untrusted)
      if: steps.pr-data.outputs.proceed == 'true' && steps.strategy.outputs.trusted != 'true'
      uses: actions/checkout@v6

    - name: Validate ref names
      if: steps.pr-data.outputs.proceed == 'true' && steps.strategy.outputs.trusted == 'true'
      shell: bash
      env:
        HEAD_REF: ${{ steps.pr-data.outputs.head-ref }}
        BASE_REF: ${{ steps.pr-data.outputs.base-ref }}
      run: |
        for ref_name in "$HEAD_REF" "$BASE_REF"; do
          if [[ ! "$ref_name" =~ ^[a-zA-Z0-9._/+-]+$ ]]; then
            echo "::error::Ref name contains disallowed characters: ${ref_name}"
            exit 1
          fi
        done

    - name: Read config from base branch
      id: config
      if: steps.pr-data.outputs.proceed == 'true' && steps.strategy.outputs.trusted == 'true'
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config }}
        BASE_REF: ${{ steps.pr-data.outputs.base-ref }}
      run: |
        if git show "origin/${BASE_REF}:${CONFIG_FILE}" > /tmp/changelog-config.yml 2>/dev/null; then
          echo "config-path=/tmp/changelog-config.yml" >> "$GITHUB_OUTPUT"
        else
          echo "config-path=${CONFIG_FILE}" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify checkout SHA
      if: steps.pr-data.outputs.proceed == 'true' && steps.strategy.outputs.trusted == 'true'
      shell: bash
      env:
        EXPECTED_SHA: ${{ steps.pr-data.outputs.head-sha }}
      run: |
        ACTUAL_SHA=$(git rev-parse HEAD)
        if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
          echo "::error::Checkout SHA mismatch (expected $EXPECTED_SHA, got $ACTUAL_SHA). Aborting."
          exit 1
        fi

    - name: Setup docs-builder
      if: steps.pr-data.outputs.proceed == 'true'
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: edge
        github-token: ${{ inputs.github-token }}

    - name: Evaluate PR
      id: evaluate
      if: steps.pr-data.outputs.proceed == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.pr-data.outputs.is-fork != 'true' && inputs.github-token || '' }}
        CONFIG_FILE: ${{ steps.config.outputs.config-path || inputs.config }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        PR_TITLE: ${{ steps.pr-data.outputs.title }}
        PR_BODY: ${{ steps.pr-data.outputs.body }}
        PR_LABELS: ${{ steps.pr-data.outputs.labels }}
        HEAD_REF: ${{ steps.pr-data.outputs.head-ref }}
        HEAD_SHA: ${{ steps.pr-data.outputs.head-sha }}
        STRIP_PREFIX: ${{ inputs.strip-title-prefix }}
      run: |
        PREFIX_FLAG=""
        if [ "$STRIP_PREFIX" = "true" ]; then
          PREFIX_FLAG="--strip-title-prefix"
        fi

        docs-builder changelog evaluate-pr \
          --config "$CONFIG_FILE" \
          --owner "$REPO_OWNER" \
          --repo "$REPO_NAME" \
          --pr-number "$PR_NUMBER" \
          --pr-title "$PR_TITLE" \
          --pr-labels "$PR_LABELS" \
          --head-ref "$HEAD_REF" \
          --head-sha "$HEAD_SHA" \
          $PREFIX_FLAG

    - name: Generate changelog
      id: generate
      if: steps.evaluate.outputs.should-generate == 'true'
      shell: bash
      env:
        CONFIG_FILE: ${{ steps.config.outputs.config-path || inputs.config }}
        CHANGELOG_PR_NUMBER: ${{ steps.pr.outputs.number }}
        CHANGELOG_TITLE: ${{ steps.evaluate.outputs.title }}
        CHANGELOG_DESCRIPTION: ${{ steps.evaluate.outputs.description }}
        CHANGELOG_TYPE: ${{ steps.evaluate.outputs.type }}
        CHANGELOG_OWNER: ${{ github.repository_owner }}
        CHANGELOG_REPO: ${{ github.event.repository.name }}
        CHANGELOG_PRODUCTS: ${{ steps.evaluate.outputs.products }}
      run: |
        mkdir -p .artifacts/changelog-staging
        docs-builder changelog add \
          --concise \
          --config "$CONFIG_FILE" \
          --output .artifacts/changelog-staging

    - name: Prepare artifact
      if: steps.pr-data.outputs.proceed == 'true'
      shell: bash
      env:
        STATUS: ${{ steps.evaluate.outputs.status }}
        GENERATE_OUTCOME: ${{ steps.generate.outcome }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_REF: ${{ steps.pr-data.outputs.head-ref }}
        HEAD_SHA: ${{ steps.pr-data.outputs.head-sha }}
        IS_FORK: ${{ steps.pr-data.outputs.is-fork }}
        HEAD_REPO: ${{ steps.pr-data.outputs.head-repo }}
        CAN_COMMIT: ${{ steps.strategy.outputs.can-commit }}
        MAINTAINER_CAN_MODIFY: ${{ steps.pr-data.outputs.maintainer-can-modify }}
        LABEL_TABLE: ${{ steps.evaluate.outputs.label-table }}
        PRODUCT_LABEL_TABLE: ${{ steps.evaluate.outputs.product-label-table }}
        SKIP_LABELS: ${{ steps.evaluate.outputs.skip-labels }}
        EXISTING_FILENAME: ${{ steps.evaluate.outputs.existing-changelog-filename }}
        CONFIG_FILE: ${{ inputs.config }}
      run: |
        docs-builder changelog prepare-artifact \
          --staging-dir .artifacts/changelog-staging \
          --output-dir .artifacts/changelog-artifact \
          --evaluate-status "$STATUS" \
          --generate-outcome "$GENERATE_OUTCOME" \
          --pr-number "$PR_NUMBER" \
          --head-ref "$HEAD_REF" \
          --head-sha "$HEAD_SHA" \
          --is-fork "$IS_FORK" \
          --head-repo "$HEAD_REPO" \
          --can-commit "$CAN_COMMIT" \
          --maintainer-can-modify "$MAINTAINER_CAN_MODIFY" \
          --label-table "$LABEL_TABLE" \
          --product-label-table "$PRODUCT_LABEL_TABLE" \
          --skip-labels "$SKIP_LABELS" \
          --config "$CONFIG_FILE" \
          --existing-changelog-filename "$EXISTING_FILENAME"

    - name: Upload staging artifact
      id: upload
      if: steps.pr-data.outputs.proceed == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: changelog-staging
        path: .artifacts/changelog-artifact
        retention-days: 1
        if-no-files-found: error
