name: Changelog bundle
description: >
  Runs docs-builder changelog bundle in option-based mode to generate a
  fully-resolved bundle file and commits the result to the repository.
  Supports filtering by GitHub release version or Buildkite promotion report.

inputs:
  config:
    description: 'Path to changelog.yml configuration file'
    default: 'docs/changelog.yml'
  release-version:
    description: >
      GitHub release tag used as the PR filter source (e.g. v9.2.0).
      Mutually exclusive with report. Requires repo to be set in
      changelog.yml (bundle.repo) or passed via the repo input.
  report:
    description: >
      Buildkite promotion report URL or local file path used as the
      PR filter source. Mutually exclusive with release-version.
  output:
    description: >
      Output file path for the bundle (e.g. docs/releases/v9.2.0.yaml).
      Must end in .yml or .yaml.
    required: true
  repo:
    description: >
      GitHub repository name. Falls back to bundle.repo in changelog.yml.
  owner:
    description: >
      GitHub repository owner. Falls back to bundle.owner in changelog.yml,
      then to elastic.
  github-token:
    description: 'GitHub token with contents:write permission'
    default: '${{ github.token }}'

outputs:
  committed:
    description: 'Whether a bundle file was committed and pushed (true/false)'
    value: ${{ steps.commit.outputs.committed || 'false' }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup docs-builder
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: edge
        github-token: ${{ inputs.github-token }}

    - name: Generate changelog bundle
      id: generate
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        RELEASE_VERSION: ${{ inputs.release-version }}
        REPORT: ${{ inputs.report }}
        OUTPUT: ${{ inputs.output }}
        REPO: ${{ inputs.repo }}
        OWNER: ${{ inputs.owner }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -n "$RELEASE_VERSION" ] && [ -n "$REPORT" ]; then
          echo "::error::Only one of 'release-version' or 'report' may be provided"
          exit 1
        fi

        if [ -z "$RELEASE_VERSION" ] && [ -z "$REPORT" ]; then
          echo "::error::Either 'release-version' or 'report' must be provided"
          exit 1
        fi

        args=(--config "$CONFIG" --resolve)

        if [ -n "$RELEASE_VERSION" ]; then
          args+=(--release-version "$RELEASE_VERSION")
        fi

        if [ -n "$REPORT" ]; then
          args+=(--report "$REPORT")
        fi

        args+=(--output "$OUTPUT")

        if [ -n "$REPO" ]; then
          args+=(--repo "$REPO")
        fi

        if [ -n "$OWNER" ]; then
          args+=(--owner "$OWNER")
        fi

        docs-builder changelog bundle "${args[@]}"

    - name: Commit bundle
      id: commit
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
        GH_TOKEN: ${{ inputs.github-token }}
        GIT_REPOSITORY: ${{ github.repository }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$OUTPUT"

        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "committed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Update changelog bundle"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GIT_REPOSITORY}.git"
          git push
          git remote set-url origin "https://github.com/${GIT_REPOSITORY}.git"
          echo "committed=true" >> "$GITHUB_OUTPUT"
        fi
