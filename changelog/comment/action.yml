name: Changelog comment
description: >
  Downloads the changelog-decision artifact from the triggering workflow run
  and posts or updates the sticky changelog PR comment. Safe to call even
  when no artifact was uploaded — the command succeeds with no action taken.
  Always comments on the newest completed run of the triggering workflow for the
  same PR branch, whichever run triggered the job, so a stale decision cannot
  overwrite a newer one and a cancelled job cannot leave the newest one unposted.

inputs:
  github-token:
    description: 'GitHub token with pull-requests: write'
    default: '${{ github.token }}'

runs:
  using: composite
  steps:
    - name: Resolve the run to comment on
      id: check-artifact
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        EVENT: ${{ github.event.workflow_run.event }}
      run: |
        # Several runs can start close together: label events, or a push right after the PR opens. Their comment
        # jobs race, and two things go wrong when each job reads its own run's artifact:
        #   - an older run's stale decision can land last and overwrite the newer one, including a run for an
        #     older commit of the same branch;
        #   - the caller's concurrency group keeps only one pending job, so it can cancel the job of the newest
        #     run and leave nobody to post it.
        # So every job comments on the newest completed run for this PR branch, whichever run triggered it.
        # A newest run that is still in progress is skipped here, because its own completion triggers a job.
        latest=$(gh api -X GET "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs" \
            -f branch="${HEAD_BRANCH}" -f event="${EVENT}" -F per_page=100 \
          | jq -r --arg repo "${HEAD_REPO}" \
              '[.workflow_runs[] | select(.head_repository.full_name == $repo and .conclusion != "cancelled")]
               | sort_by(.id) | last // empty | "\(.id) \(.status)"') || latest=""

        target="${RUN_ID}"
        status="completed"
        if [ -n "${latest}" ]; then
          target="${latest% *}"
          status="${latest#* }"
        fi

        count=0
        if [ "${status}" != "completed" ]; then
          echo "Run ${target} is the newest for ${HEAD_REPO}:${HEAD_BRANCH} and is still running; its own completion will comment."
        else
          if [ "${target}" != "${RUN_ID}" ]; then
            echo "Commenting on the newest run ${target} instead of the triggering run ${RUN_ID}."
          fi
          count=$(gh api "repos/${REPO}/actions/runs/${target}/artifacts" \
            --jq '[.artifacts[] | select(.name == "changelog-decision")] | length') || count=0
        fi

        echo "run-id=${target}" >> "$GITHUB_OUTPUT"
        echo "exists=$([ "$count" -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

    - name: Download decision artifact
      if: steps.check-artifact.outputs.exists == 'true'
      uses: actions/download-artifact@v8
      with:
        name: changelog-decision
        github-token: ${{ inputs.github-token }}
        run-id: ${{ steps.check-artifact.outputs.run-id }}
        path: /tmp/changelog-decision

    - name: Setup docs-builder
      if: steps.check-artifact.outputs.exists == 'true'
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: edge
        github-token: ${{ inputs.github-token }}

    - name: Post or update changelog comment
      if: steps.check-artifact.outputs.exists == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        docs-builder changelog github-comment \
          --metadata /tmp/changelog-decision/metadata.json
