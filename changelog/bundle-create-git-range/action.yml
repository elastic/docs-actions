name: Changelog bundle create (git commit range mode)
description: >
  Runs docs-builder changelog bundle natively for a profile and a git commit
  range (start-git-ref..end-git-ref) and uploads the result as an artifact.
  The PR list is derived from the range itself (GitHub compare API + GraphQL
  associatedPullRequests); each entry is sourced pool-first with PR-metadata
  fallback. No Docker, no plan step. Reads the output path from the
  bundle_path step output emitted by docs-builder itself. Does not run
  actions/checkout: the caller prepares the workspace, including
  docs/changelog.yml. With dry-run, only the run report is written to the job
  summary. For release-driven bundling see changelog/bundle-create-version.
inputs:
  profile:
    description: >
      Bundle profile name from bundle.profiles in changelog.yml (for example
      serverless-release). The profile must not set a products pattern or
      source: github_release; the PR list comes from the commit range.
    required: true
  version:
    description: >
      Version string for the bundle, used for {version} substitution and the
      output file name (for example a date such as 2026-10-06).
    required: true
  start-git-ref:
    description: >
      Start ref (exclusive) of the commit range: the previously published
      endpoint ref. Required — it is never inferred.
    required: true
  end-git-ref:
    description: >
      End ref (inclusive) of the commit range: the currently published endpoint
      ref. Recorded in the bundle as the git_ref metadata field.
    required: true
  dry-run:
    description: >
      Resolve the commit range and write the run report (resolved PR list with
      per-PR entry source) to the job summary, without writing a bundle or
      uploading an artifact.
    default: 'false'
  repo:
    description: >
      GitHub repository name, forwarded only when set. Falls back to
      bundle.repo in changelog.yml. Used in the {repo}-{product}-{version}.yaml
      file name.
  owner:
    description: >
      GitHub repository owner, forwarded only when set. Falls back to
      bundle.owner in changelog.yml, then elastic.
  docs-builder-version:
    description: >
      docs-builder version to use (e.g. 0.1.100, latest, edge).
      Non-edge versions are attestation-verified by the setup action.
    default: 'edge'
  artifact-name:
    description: 'Name for the uploaded artifact (must match bundle-publish artifact-name)'
    default: 'changelog-bundle'
  github-token:
    description: >
      GitHub token. Required: the GraphQL API used for commit-to-PR association
      does not accept anonymous requests. It must be able to read the repository
      that owns the commit range.
    default: '${{ github.token }}'
outputs:
  bundle-path:
    description: 'Repo-relative path to the generated bundle .yml file. Empty in dry-run.'
    value: ${{ steps.generate.outputs.bundle_path }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        VERSION: ${{ inputs.version }}
        START_GIT_REF: ${{ inputs.start-git-ref }}
        END_GIT_REF: ${{ inputs.end-git-ref }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPO: ${{ inputs.repo }}
        OWNER: ${{ inputs.owner }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        source "${GITHUB_ACTION_PATH}/../../scripts/validate-inputs.sh"
        for pair in "profile:$PROFILE" "version:$VERSION" "start-git-ref:$START_GIT_REF" "end-git-ref:$END_GIT_REF"; do
          if [ -z "${pair#*:}" ]; then
            echo "::error::${pair%%:*} is required"; exit 1
          fi
        done
        if [ "$DRY_RUN" != "true" ] && [ "$DRY_RUN" != "false" ]; then
          echo "::error::dry-run must be 'true' or 'false': ${DRY_RUN}"; exit 1
        fi
        validate_identifier "$PROFILE" "profile" '^[a-zA-Z0-9._-]+$'
        validate_identifier "$VERSION" "version" '^[a-zA-Z0-9._+-]+$'
        validate_identifier "$START_GIT_REF" "start-git-ref" '^[a-zA-Z0-9][a-zA-Z0-9._/+-]*$'
        validate_identifier "$END_GIT_REF" "end-git-ref" '^[a-zA-Z0-9][a-zA-Z0-9._/+-]*$'
        validate_identifier "$REPO" "repo" '^[a-zA-Z0-9._-]+$'
        validate_identifier "$OWNER" "owner" '^[a-zA-Z0-9._-]+$'
        validate_identifier "$ARTIFACT_NAME" "artifact-name" '^[a-zA-Z0-9._-]+$'
    - name: Setup docs-builder
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: ${{ inputs.docs-builder-version }}
        github-token: ${{ inputs.github-token }}
    - name: Generate changelog bundle from commit range
      id: generate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROFILE: ${{ inputs.profile }}
        VERSION: ${{ inputs.version }}
        START_GIT_REF: ${{ inputs.start-git-ref }}
        END_GIT_REF: ${{ inputs.end-git-ref }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPO: ${{ inputs.repo }}
        OWNER: ${{ inputs.owner }}
      run: |
        # Profile mode discovers the config from ./changelog.yml or ./docs/changelog.yml.
        ARGS=(changelog bundle "$PROFILE" "$VERSION" --start-git-ref "$START_GIT_REF" --end-git-ref "$END_GIT_REF")
        [ -n "$REPO" ] && ARGS+=(--repo "$REPO")
        [ -n "$OWNER" ] && ARGS+=(--owner "$OWNER")
        if [ "$DRY_RUN" = "true" ]; then
          ARGS+=(--dry-run)
          # The commit-range run report is the dry run's product: show it in the job summary.
          # docs-builder prints the report twice and follows it with per-PR diagnostics;
          # keep the first report block and stop at the first log line.
          docs-builder "${ARGS[@]}" | tee .bundle-dry-run.log
          awk '/^### Changelog bundle for/{n++; if (n == 2) exit} n >= 1 && /^(info|warn|error|fail) *::/{exit} n >= 1' .bundle-dry-run.log >> "$GITHUB_STEP_SUMMARY"
          rm -f .bundle-dry-run.log
        else
          docs-builder "${ARGS[@]}"
        fi
    - name: Verify bundle path
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        BUNDLE_PATH: ${{ steps.generate.outputs.bundle_path }}
      run: |
        if [ -z "$BUNDLE_PATH" ]; then
          echo "::error::docs-builder did not emit bundle_path. Use a docs-builder version that supports the bundle_path output."
          exit 1
        fi
        if [ ! -f "$BUNDLE_PATH" ]; then
          echo "::error::bundle_path was emitted but the file does not exist: ${BUNDLE_PATH}"
          exit 1
        fi
    - name: Upload bundle artifact
      if: inputs.dry-run != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.generate.outputs.bundle_path }}
        if-no-files-found: error
        retention-days: 1
