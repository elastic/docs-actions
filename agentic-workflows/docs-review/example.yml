name: Docs Review
on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  discussions: write
  pull-requests: write

jobs:
  run:
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/docs-review')
    uses: elastic/docs-actions/.github/workflows/gh-aw-docs-review.lock.yml@v1
    with:
      review-scope: docs-subtree
