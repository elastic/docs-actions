name: Docs Auto Triage
on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  run:
    uses: elastic/docs-actions/.github/workflows/gh-aw-issue-auto-triage.lock.yml@v1
    with:
      project-instructions-path: .github/triage-instructions.md
