name: Docs Triage
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/triage')
    uses: elastic/docs-actions/.github/workflows/gh-aw-issue-triage.lock.yml@v1
    with:
      project-instructions-path: .github/triage-instructions.md
