name: docs-builder/setup
description: 'Set up elastic/docs-builder CLI for use in actions'

inputs:
  version:
    description: 'docs-builer version'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token'
    required: false
    default: '${{ github.token }}'

runs:
  using: composite

  steps:
    - name: Acquire docs-builder binary
      shell: bash
      run: |
        INSTALL_DIR="${HOME}/.docs-builder/bin"
        mkdir -p "${INSTALL_DIR}"

        if [[ "${DOCS_BUILDER_VERSION}" == "edge" ]]; then
            # Resolve :edge to a RepoDigest, then verify the SLSA
            # build-provenance attestation minted by docs-builder's
            # prerelease.yml (elastic/docs-eng-team#518). This matches
            # the non-edge path's `gh attestation verify` step on the
            # release zip below — :edge is no longer the unverified
            # cousin. Fail closed if the attestation is missing or
            # signed by an unexpected workflow.
            EDGE_IMAGE="ghcr.io/elastic/docs-builder:edge"
            docker pull "${EDGE_IMAGE}"
            EDGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${EDGE_IMAGE}")
            if [ -z "${EDGE_DIGEST}" ]; then
              echo "::error::Failed to resolve RepoDigest for ${EDGE_IMAGE}"
              exit 1
            fi

            # `-R` constrains the attestation issuer to the
            # docs-builder repo so an attacker cannot publish a
            # self-signed attestation under their own repo and have it
            # accepted here.
            gh attestation verify "oci://${EDGE_DIGEST}" -R elastic/docs-builder

            echo "::notice title=docs-builder image digest::${EDGE_DIGEST}"
            CONTAINER_ID=$(docker create "${EDGE_DIGEST}")
            trap "docker rm -f ${CONTAINER_ID} >/dev/null 2>&1 || true" EXIT
            docker cp "${CONTAINER_ID}:/app/docs-builder" "${INSTALL_DIR}/docs-builder"
        else
            if [[ "${DOCS_BUILDER_VERSION}" == "latest" ]]; then
              DOCS_BUILDER_VERSION="" # empty string to get the latest version
            fi

            TEMP_DIR=$(mktemp -d)
            trap "rm -rf ${TEMP_DIR}" EXIT

            gh release download "${DOCS_BUILDER_VERSION}" --pattern 'docs-builder-linux-x64.zip' --repo elastic/docs-builder --dir "${TEMP_DIR}"
            gh attestation verify "${TEMP_DIR}/docs-builder-linux-x64.zip" -R elastic/docs-builder
            unzip -p "${TEMP_DIR}/docs-builder-linux-x64.zip" docs-builder > "${INSTALL_DIR}/docs-builder"
        fi

        chmod +x "${INSTALL_DIR}/docs-builder"
        echo "${INSTALL_DIR}" >> $GITHUB_PATH

        echo "::notice title=Builder version::$(${INSTALL_DIR}/docs-builder --version)"

      env:
        DOCS_BUILDER_VERSION: '${{ inputs.version }}'
        GH_TOKEN: '${{ inputs.github-token }}'
