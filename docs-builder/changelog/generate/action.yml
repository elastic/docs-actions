name: docs-builder/changelog/generate
description: >
  Generate a changelog entry for a pull request using docs-builder.
  Handles setup, generation, artifact upload, and PR guard checks.

inputs:
  config:
    description: 'Path to changelog.yml configuration file'
    default: 'docs/changelog.yml'
  strip-title-prefix:
    description: 'Remove [Prefix]: from PR titles'
    default: 'false'
  changelog-dir:
    description: 'Directory for changelog entry files'
    default: 'docs/changelog'
  docs-builder-version:
    description: 'docs-builder version to install'
    default: 'edge'
  github-token:
    description: 'GitHub token for API access'
    default: '${{ github.token }}'

outputs:
  status:
    description: 'Result: success, no-label, no-title, error, manually-edited, or skipped'
    value: ${{ steps.resolve.outputs.status }}

runs:
  using: composite
  steps:
    - name: Check for skip label or last commit from bot
      id: preflight
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        # language=javascript
        script: |
          const labels = context.payload.pull_request.labels.map(l => l.name);
          if (labels.includes('changelog:skip')) {
            core.info('changelog:skip label found, skipping changelog generation');
            core.setOutput('should-proceed', 'false');
            return;
          }

          if (context.payload.action === 'synchronize') {
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });
            const author = commit.author?.login || commit.commit?.author?.name || '';
            if (author === 'github-actions[bot]') {
              core.info('Last commit is from github-actions[bot], skipping to prevent loop');
              core.setOutput('should-proceed', 'false');
              return;
            }
          }

          core.setOutput('should-proceed', 'true');

    - name: Checkout
      if: steps.preflight.outputs.should-proceed == 'true'
      uses: actions/checkout@v6

    - name: Evaluate PR metadata
      id: evaluate
      if: steps.preflight.outputs.should-proceed == 'true'
      shell: bash
      env:
        CHANGELOG_DIR: ${{ inputs.changelog-dir }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CONFIG_FILE: ${{ inputs.config }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        STRIP_TITLE_PREFIX: ${{ inputs.strip-title-prefix }}
      run: |
        # --- Manual edit check ---
        CHANGELOG_FILE="${CHANGELOG_DIR}/${PR_NUMBER}.yaml"
        if [ -f "$CHANGELOG_FILE" ]; then
          LAST_AUTHOR=$(git log -1 --format='%an' -- "$CHANGELOG_FILE" 2>/dev/null || echo "")
          if [ -n "$LAST_AUTHOR" ] && [ "$LAST_AUTHOR" != "github-actions[bot]" ]; then
            echo "Changelog was manually edited by $LAST_AUTHOR, skipping regeneration"
            echo "should-generate=false" >> "$GITHUB_OUTPUT"
            echo "should-upload=false" >> "$GITHUB_OUTPUT"
            echo "status=manually-edited" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        # --- Title resolution ---
        TITLE="$PR_TITLE"
        if [ "$STRIP_TITLE_PREFIX" = "true" ]; then
          while [[ "$TITLE" == \[* ]]; do
            TITLE="${TITLE#*]}"
            TITLE="${TITLE#"${TITLE%%[![:space:]]*}"}"
          done
          if [[ "$TITLE" == :* ]]; then
            TITLE="${TITLE#:}"
            TITLE="${TITLE#"${TITLE%%[![:space:]]*}"}"
          fi
        fi

        if [ -z "$TITLE" ]; then
          echo "::error::PR has no title. Cannot generate changelog entry."
          echo "should-generate=false" >> "$GITHUB_OUTPUT"
          echo "should-upload=false" >> "$GITHUB_OUTPUT"
          echo "status=no-title" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        {
          echo "title<<PR_TITLE_EOF"
          echo "$TITLE"
          echo "PR_TITLE_EOF"
        } >> "$GITHUB_OUTPUT"

        # --- Type resolution from labels + config ---
        PR_LABELS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")

        TYPE=""
        if [ -f "$CONFIG_FILE" ] && [ -n "$PR_LABELS" ]; then
          MAPPING=$(yq eval '
            .pivot.types // {} | to_entries[] |
            select(.value != null) |
            .key as $type |
            (
              select(.value | type == "!!str") | .value | split(",")[] | sub("^ +"; "") | sub(" +$"; "") | select(length > 0) | ($type + "=" + .),
              select(.value | type == "!!seq") | .value[] | ($type + "=" + .),
              select(.value | type == "!!map") | (.value.labels // "") |
                (select(type == "!!seq") | .[] | ($type + "=" + .),
                 select(type == "!!str") | split(",")[] | sub("^ +"; "") | sub(" +$"; "") | select(length > 0) | ($type + "=" + .))
            )
          ' "$CONFIG_FILE" 2>/dev/null || echo "")

          while IFS= read -r label; do
            [ -z "$label" ] && continue
            MATCHED=$(echo "$MAPPING" | awk -F= -v lbl="$label" '$2 == lbl {print $1; exit}')
            if [ -n "$MATCHED" ]; then
              TYPE="$MATCHED"
              break
            fi
          done <<< "$PR_LABELS"
        fi

        echo "type=$TYPE" >> "$GITHUB_OUTPUT"

        if [ -z "$TYPE" ]; then
          # Build a label→type table for the PR comment
          if [ -f "$CONFIG_FILE" ]; then
            TABLE=$(yq eval '
              .pivot.types // {} | to_entries[] |
              select(.value != null) |
              .key as $type |
              (
                select(.value | type == "!!str") | .value,
                select(.value | type == "!!seq") | .value | join(","),
                select(.value | type == "!!map") | (.value.labels // "") |
                  (select(type == "!!seq") | join(","), select(type == "!!str"))
              ) |
              select(length > 0) |
              split(",")[] | sub("^ +"; "") | sub(" +$"; "") |
              select(length > 0) |
              "| `" + . + "` | " + $type + " |"
            ' "$CONFIG_FILE" 2>/dev/null || echo "")
          else
            TABLE=""
          fi

          {
            echo "label-table<<LABEL_TABLE_EOF"
            echo "$TABLE"
            echo "LABEL_TABLE_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "should-generate=false" >> "$GITHUB_OUTPUT"
          echo "should-upload=true" >> "$GITHUB_OUTPUT"
          echo "status=no-label" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # --- All checks passed ---
        echo "should-generate=true" >> "$GITHUB_OUTPUT"
        echo "should-upload=true" >> "$GITHUB_OUTPUT"
        echo "status=proceed" >> "$GITHUB_OUTPUT"

    - name: Setup docs-builder
      if: steps.evaluate.outputs.should-generate == 'true'
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: ${{ inputs.docs-builder-version }}
        github-token: ${{ inputs.github-token }}

    - name: Run changelog add
      id: generate
      if: steps.evaluate.outputs.should-generate == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        CONFIG_FILE: ${{ inputs.config }}
        PR_TITLE: ${{ steps.evaluate.outputs.title }}
        PR_TYPE: ${{ steps.evaluate.outputs.type }}
      run: |
        mkdir -p /tmp/changelog-staging
        docs-builder changelog add \
          --prs "$PR_NUMBER" \
          --owner "$OWNER" \
          --repo "$REPO" \
          --use-pr-number \
          --output /tmp/changelog-staging \
          --config "$CONFIG_FILE" \
          --title "$PR_TITLE" \
          --type "$PR_TYPE"

    - name: Prepare artifact
      if: >
        always()
        && (steps.generate.outcome == 'success'
        || steps.evaluate.outputs.status == 'no-label')
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CONFIG_FILE: ${{ inputs.config }}
        CHANGELOG_DIR: ${{ inputs.changelog-dir }}
        LABEL_TABLE: ${{ steps.evaluate.outputs.label-table }}
      run: |
        mkdir -p /tmp/changelog-result

        if [ "${{ steps.generate.outcome }}" = "success" ]; then
          STATUS="success"
          cp "/tmp/changelog-staging/${PR_NUMBER}.yaml" "/tmp/changelog-result/${PR_NUMBER}.yaml"
        else
          STATUS="no-label"
        fi

        cat > /tmp/changelog-result/metadata.json <<METADATA_EOF
        {
          "pr_number": ${PR_NUMBER},
          "head_ref": "${HEAD_REF}",
          "head_sha": "${HEAD_SHA}",
          "status": "${STATUS}",
          "label_table": $(echo "$LABEL_TABLE" | jq -Rs .),
          "config_file": "${CONFIG_FILE}",
          "changelog_dir": "${CHANGELOG_DIR}"
        }
        METADATA_EOF

    - name: Upload artifact
      if: >
        always()
        && (steps.generate.outcome == 'success'
        || steps.evaluate.outputs.status == 'no-label')
      uses: actions/upload-artifact@v4
      with:
        name: changelog-result
        path: /tmp/changelog-result/
        retention-days: 1

    - name: Resolve status
      id: resolve
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.preflight.outputs.should-proceed }}" != "true" ]; then
          echo "status=skipped" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.evaluate.outputs.status }}" = "proceed" ]; then
          if [ "${{ steps.generate.outcome }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "status=${{ steps.evaluate.outputs.status }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Fail if needed
      if: >
        always()
        && (steps.resolve.outputs.status == 'no-title'
        || steps.resolve.outputs.status == 'no-label'
        || steps.resolve.outputs.status == 'error')
      shell: bash
      env:
        STATUS: ${{ steps.resolve.outputs.status }}
      run: |
        case "$STATUS" in
          no-title)
            echo "::error::PR has no title. Cannot generate a changelog entry without a title."
            ;;
          no-label)
            echo "::error::No valid type label found. Add a type label or changelog:skip to this PR."
            ;;
          *)
            echo "::error::Changelog generation failed unexpectedly."
            ;;
        esac
        exit 1
