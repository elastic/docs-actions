name: docs-builder/changelog/commit
description: >
  Download a changelog artifact from a generate workflow run,
  commit it to the PR branch, and post a PR comment.

inputs:
  run-id:
    description: 'Workflow run ID to download the changelog artifact from'
    required: true
  github-token:
    description: 'GitHub token with contents:write and pull-requests:write'
    default: '${{ github.token }}'
  artifact-name:
    description: 'Name of the artifact to download'
    default: 'changelog-result'

outputs:
  committed:
    description: 'Whether a changelog was committed (true/false)'
    value: ${{ steps.commit.outputs.committed || 'false' }}
  pr-number:
    description: 'The PR number from the changelog metadata'
    value: ${{ steps.evaluate.outputs.pr-number }}

runs:
  using: composite
  steps:
    - name: Download artifact
      id: download
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: /tmp/changelog-result
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Evaluate artifact and validate PR
      id: evaluate
      if: steps.download.outcome == 'success'
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        # language=javascript
        script: |
          const fs = require('fs');

          const metaPath = '/tmp/changelog-result/metadata.json';
          if (!fs.existsSync(metaPath)) {
            core.info('No metadata file found in artifact');
            return;
          }

          const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
          core.setOutput('pr-number', String(meta.pr_number));
          core.setOutput('head-ref', meta.head_ref);
          core.setOutput('status', meta.status);
          core.setOutput('config-file', meta.config_file);
          core.setOutput('changelog-dir', meta.changelog_dir);
          core.setOutput('label-table', meta.label_table || '');

          const { owner, repo } = context.repo;
          const prNumber = meta.pr_number;

          const { data: pr } = await github.rest.pulls.get({
            owner, repo, pull_number: prNumber,
          });

          if (pr.head.sha !== meta.head_sha) {
            core.info(`PR head has moved (expected ${meta.head_sha}, now ${pr.head.sha}). A newer generate run should handle this.`);
            return;
          }

          const labels = pr.labels.map(l => l.name);
          if (labels.includes('changelog:skip')) {
            core.info('changelog:skip label found on PR, aborting commit.');
            return;
          }

          if (meta.status === 'success') {
            core.setOutput('should-commit', 'true');
          } else if (meta.status === 'no-label') {
            core.setOutput('should-comment-failure', 'true');
          }

    - name: Checkout PR branch
      if: steps.evaluate.outputs.should-commit == 'true'
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.evaluate.outputs.head-ref }}
        token: ${{ inputs.github-token }}
        persist-credentials: true

    - name: Commit changelog
      if: steps.evaluate.outputs.should-commit == 'true'
      id: commit
      shell: bash
      env:
        PR_NUMBER: ${{ steps.evaluate.outputs.pr-number }}
        CHANGELOG_DIR: ${{ steps.evaluate.outputs.changelog-dir }}
      run: |
        mkdir -p "$CHANGELOG_DIR"
        cp "/tmp/changelog-result/${PR_NUMBER}.yaml" "$CHANGELOG_DIR/${PR_NUMBER}.yaml"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$CHANGELOG_DIR/${PR_NUMBER}.yaml"

        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "committed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Add changelog for PR #${PR_NUMBER}"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Post success comment
      if: steps.commit.outputs.committed == 'true'
      uses: actions/github-script@v8
      env:
        PR_NUMBER: ${{ steps.evaluate.outputs.pr-number }}
        HEAD_REF: ${{ steps.evaluate.outputs.head-ref }}
        CHANGELOG_DIR: ${{ steps.evaluate.outputs.changelog-dir }}
      with:
        github-token: ${{ inputs.github-token }}
        # language=javascript
        script: |
          const title = '### 📋 Changelog';
          const prNumber = parseInt(process.env.PR_NUMBER, 10);
          const branch = process.env.HEAD_REF;
          const { owner, repo } = context.repo;
          const filePath = `${process.env.CHANGELOG_DIR}/${prNumber}.yaml`;
          const viewUrl = `https://github.com/${owner}/${repo}/blob/${branch}/${filePath}`;
          const editUrl = `https://github.com/${owner}/${repo}/edit/${branch}/${filePath}`;

          const body = [
            title,
            '',
            `Changelog entry committed: [\`${filePath}\`](${viewUrl})`,
            '',
            `[✏️ Edit this changelog](${editUrl})`,
          ].join('\n');

          const issue_number = prNumber;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number,
          });
          const existing = comments.find(c =>
            c.user.type === 'Bot' &&
            c.body.startsWith(title)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo,
              issue_number,
              body,
            });
          }

    - name: Post failure comment with available labels
      if: steps.evaluate.outputs.should-comment-failure == 'true'
      uses: actions/github-script@v8
      env:
        PR_NUMBER: ${{ steps.evaluate.outputs.pr-number }}
        LABEL_TABLE: ${{ steps.evaluate.outputs.label-table }}
        CONFIG_FILE: ${{ steps.evaluate.outputs.config-file }}
      with:
        github-token: ${{ inputs.github-token }}
        # language=javascript
        script: |
          const title = '### 📋 Changelog';
          const { owner, repo } = context.repo;
          const prNumber = parseInt(process.env.PR_NUMBER, 10);
          const configFile = process.env.CONFIG_FILE || 'docs/changelog.yml';
          const labelRows = process.env.LABEL_TABLE || '';

          let labelSection;
          if (labelRows.trim()) {
            labelSection = [
              '',
              'Add one of these labels to your PR:',
              '',
              '| Label | Changelog type |',
              '|---|---|',
              labelRows,
            ].join('\n');
          } else {
            labelSection = `\nAdd a type label that matches your \`pivot.types\` configuration in \`${configFile}\`.`;
          }

          const body = [
            title,
            '',
            '⚠️ **Cannot generate changelog:** no matching type label found on this PR.',
            labelSection,
            '',
            'To skip the changelog for this PR, add the `changelog:skip` label.',
          ].join('\n');

          const issue_number = prNumber;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number,
          });
          const existing = comments.find(c =>
            c.user.type === 'Bot' &&
            c.body.startsWith(title)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo,
              issue_number,
              body,
            });
          }
