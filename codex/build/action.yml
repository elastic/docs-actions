name: codex/build
description: Builds the codex documentation

inputs:
  docs-builder-version:
    description: The version of docs-builder to use
    required: false
    default: "edge"
  path:
    description: Root directory of the documentation source. Defaults to the docs-builder default.
    required: false
    default: ""
  build-env:
    description: Environment variables for the docs-builder process, one KEY=VALUE per line.
    required: false
    default: ""

outputs:
  path-prefix:
    description: The path prefix for the documentation
    value: ${{ steps.generate-path-prefix.outputs.result }}

runs:
  using: composite
  steps:
    - name: Setup docs-builder
      uses: elastic/docs-actions/docs-builder/setup@v1
      with:
        version: ${{ inputs.docs-builder-version }}
    - name: Generate env.PATH_PREFIX
      id: generate-path-prefix
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: | # zizmor: ignore[github-env] PATH_PREFIX from trusted workflow context
        case "${GITHUB_EVENT_NAME}" in
          "merge_group" | "pull_request" | "pull_request_target")
            path_prefix="/_preview/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
            ;;
          "push" | "workflow_dispatch")
            path_prefix="/_preview/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
            ;;
          *)
            echo "Unsupported event: '${GITHUB_EVENT_NAME}'";
            exit 1;
            ;;
        esac
        echo "PATH_PREFIX=${path_prefix}" >> $GITHUB_ENV
        echo "result=${path_prefix}" >> $GITHUB_OUTPUT
      shell: bash
    - name: Generate vault role
      id: generate-vault-role
      shell: bash
      run: |
          workflow_ref=$(echo "${GITHUB_WORKFLOW_REF}" | awk -F'@' '{print $1}')
          echo "${workflow_ref}"
          hash=$(echo -n "${workflow_ref}" | sha256sum | awk '{print substr($1, 1, 12)}')
          echo "result=token-policy-${hash}" >> "${GITHUB_OUTPUT}"
    # Fetch a token for reading elastic/codex-link-index (private). Non-fatal:
    # callers without codex cross-links don't need it, and callers missing the
    # policy registration (catalog-info) fall back to the same anonymous-HTTPS
    # behavior that existed before this step was added.
    - name: Fetch ephemeral GitHub token for codex-link-index read
      id: fetch-ephemeral-token
      uses: elastic/ci-gh-actions/fetch-github-token@v1
      continue-on-error: true
      with:
          vault-instance: "ci-prod"
          vault-role: "${{ steps.generate-vault-role.outputs.result }}"
    - name: Explain codex-link-index token fetch failure
      if: steps.fetch-ephemeral-token.outcome == 'failure'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [[ "${EVENT_NAME}" == "pull_request" && "${HEAD_REPOSITORY}" != "${REPOSITORY}" ]]; then
          echo "::error::Fork pull_request jobs cannot clone elastic/codex-link-index. GitHub does not mint an OIDC token for fork PRs, so cross-links declared in docset.yml cannot be validated. Push the branch to ${REPOSITORY} and open the PR from there."
        else
          echo "::warning::Could not fetch a GitHub token for elastic/codex-link-index. Cross-links declared in docset.yml may fail to resolve. Confirm permissions.id-token: write on this job and that catalog-info registers a token policy for this workflow."
        fi
    - name: Build
      shell: bash
      run: |
        args=(--output ./.artifacts/docs/html --path-prefix "${PATH_PREFIX}")
        if [[ -n "${DOCS_PATH}" ]]; then
          args+=(--path "${DOCS_PATH}")
        fi
        # Exported here rather than written to $GITHUB_ENV so the variables reach docs-builder
        # without leaking into later steps of the caller's job.
        line_number=0
        while IFS= read -r entry; do
          line_number=$((line_number + 1))
          entry="${entry%$'\r'}"
          [[ -z "${entry//[[:space:]]/}" ]] && continue
          if [[ ! "${entry}" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
            # The line is not echoed back: a malformed entry may still hold a secret.
            echo "::error title=Invalid build-env entry::Line ${line_number} is not KEY=VALUE."
            exit 1
          fi
          export "${entry?}"
        done <<< "${BUILD_ENV}"
        docs-builder "${args[@]}"
      env:
        PATH_PREFIX: ${{ env.PATH_PREFIX }}
        DOCS_PATH: ${{ inputs.path }}
        BUILD_ENV: ${{ inputs.build-env }}
        GITHUB_TOKEN: ${{ steps.fetch-ephemeral-token.outputs.token }}
    - name: Upload docs
      uses: actions/upload-artifact@v7
      with:
        name: docs
        path: .artifacts/docs/html
        compression-level: 1
        retention-days: 1
        if-no-files-found: error

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: links
        path: .artifacts/docs/html/links.json
        compression-level: 1
        retention-days: 1
        if-no-files-found: error
