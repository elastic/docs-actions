  cli-proxy:
    container_name: awf-cli-proxy
    networks:
      awf-net:
        ipv4_address: 172.30.0.50
    extra_hosts:
      host.docker.internal: host-gateway
    volumes:
      - /tmp/gh-aw/sandbox/firewall/logs/cli-proxy-logs:/var/log/cli-proxy:rw
      - /tmp/gh-aw/difc-proxy-tls/ca.crt:/tmp/proxy-tls/ca.crt:ro
    environment:
      AWF_DIFC_PROXY_HOST: awmg-cli-proxy
      AWF_DIFC_PROXY_PORT: '18443'
      GITHUB_REPOSITORY: elastic/opentelemetry
      GH_TOKEN: '[REDACTED]'
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal
