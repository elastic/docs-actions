      test:
        - CMD
        - curl
        - '-f'
        - http://127.0.0.1:11000/health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      squid-proxy:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
