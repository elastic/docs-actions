rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        elastic/*: ref-pin

  dangerous-triggers:
    ignore:
      - required-labels.yml
      - test-vale-report.yml

  # agentics-maintenance.yml is auto-generated by `gh aw compile`; inputs.operation is
  # a restricted choice type and inputs.run_url is only echoed to GITHUB_OUTPUT — not executed.
  # *.lock.yml files are also auto-generated; their vars.GH_AW_DEFAULT_* findings are
  # repository variables (not user-controlled) used only for numeric credit limits.
  template-injection:
    ignore:
      - agentics-maintenance.yml
      - docs-agent-experimental.lock.yml
      - gh-aw-docs-applies-to-sweep.lock.yml
      - gh-aw-docs-coherence-sweep.lock.yml
      - gh-aw-docs-frontmatter-sweep.lock.yml
      - gh-aw-docs-issue-scope.lock.yml
      - gh-aw-docs-openings-sweep.lock.yml
      - gh-aw-docs-review.lock.yml
      - gh-aw-docs-staleness-sweep.lock.yml
      - gh-aw-docs-style-sweep.lock.yml
      - gh-aw-docs-typos-sweep.lock.yml
      - gh-aw-issue-auto-triage.lock.yml
      - gh-aw-issue-size.lock.yml
      - gh-aw-issue-triage.lock.yml

  # *.lock.yml files are auto-generated by `gh aw compile`. The gh-aw compiler pins
  # actions/github-script@v9.0.0 using the dereferenced commit SHA (3a2844b7…), while
  # zizmor's online audit expects the annotated-tag object SHA returned by the GitHub API
  # (d746ffe3…). Suppressed here because the compiler owns these files.
  ref-version-mismatch:
    ignore:
      - docs-agent-experimental.lock.yml
      - gh-aw-docs-applies-to-sweep.lock.yml
      - gh-aw-docs-coherence-sweep.lock.yml
      - gh-aw-docs-frontmatter-sweep.lock.yml
      - gh-aw-docs-issue-scope.lock.yml
      - gh-aw-docs-openings-sweep.lock.yml
      - gh-aw-docs-review.lock.yml
      - gh-aw-docs-staleness-sweep.lock.yml
      - gh-aw-docs-style-sweep.lock.yml
      - gh-aw-docs-typos-sweep.lock.yml
      - gh-aw-issue-auto-triage.lock.yml
      - gh-aw-issue-size.lock.yml
      - gh-aw-issue-triage.lock.yml
