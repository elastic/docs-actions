name: "Docs `applies_to` sweep agent"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      additional-instructions:
        default: ""
        description: Repo-specific instructions appended to the agent prompt
        required: false
        type: string
      docs-root:
        default: docs/
        description: Root directory to sweep (relative to repo root)
        required: false
        type: string
      max-per-fix-issue:
        default: "20"
        description: Cap on findings per fix-issue; overflow is noted and surfaces in next sweep
        required: false
        type: string
      scope-mode:
        default: auto
        description: "How to scope matched markdown files: auto preserves the default behavior, full scans every matched file, and shard applies rotating shard selection within the matched set."
        required: false
        type: string
      setup-commands:
        default: ""
        description: Shell commands to run before the agent starts
        required: false
        type: string
      source-repo:
        default: ""
        description: Repository to scan (owner/repo). Defaults to the calling repo. Set this when the workflow runs in an internal triage repo but should audit a public docs repo.
        required: false
        type: string
      target-batch-size:
        default: "100"
        description: Approximate pages per rotating slice; controls shard count N = ceil(total/batch-size)
        required: false
        type: string
      target-path:
        default: ""
        description: Optional docs-root-relative directory to sweep recursively. Accepts a leading slash.
        required: false
        type: string
    outputs:
      created_issue_number:
        description: Number of the first created issue
        value: ${{ jobs.safe_outputs.outputs.created_issue_number }}
      created_issue_url:
        description: URL of the first created issue
        value: ${{ jobs.safe_outputs.outputs.created_issue_url }}
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false
      DOCS_LITELLM_API_KEY:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false
      GH_AW_PLUGINS_TOKEN:
        required: false

permissions: {}

concurrency:
  cancel-in-progress: false
  group: gh-aw-docs-applies-to-sweep-${{ github.run_id }}

run-name: "Docs `applies_to` sweep agent"

