name: test-codex-build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'codex/build/**'
      - '.github/workflows/test-codex-build.yml'
  push:
    branches:
      - main
    paths:
      - 'codex/build/**'
      - '.github/workflows/test-codex-build.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: 'codex/build/**'
      - name: Mock docs-builder setup
        run: |
          mkdir -p docs
          cd docs
          
          cat > docset.yml <<EOF
          display_name: test
          toc:
            - file: index.md
          EOF

          cat > index.md <<EOF
          # Test
          This is a test.
          EOF
          
      - uses: ./codex/build
        with:
          version: edge
