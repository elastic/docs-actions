name: Compile check

on:
  pull_request:
    paths:
      - 'workflows/**/*.md'
      - '.github/workflows/gh-aw-*.lock.yml'

permissions:
  contents: read

jobs:
  compile-check:
    name: Verify lock files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install gh-aw
        run: |
          GOBIN="$(pwd)/bin" go install github.com/github/gh-aw/cmd/gh-aw@v0.45.1

      - name: Compile
        run: ./scripts/compile.sh bin/gh-aw

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet .github/workflows/*.lock.yml; then
            echo "::error::Lock files are out of date. Run 'make compile' and commit the changes."
            git diff --stat .github/workflows/*.lock.yml
            exit 1
          fi
