name: Changelog validate

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to changelog.yml configuration file'
        type: string
        default: 'docs/changelog.yml'

permissions: {}

concurrency:
  group: changelog-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate changelog
        uses: elastic/docs-actions/changelog/validate@v1
        with:
          config: ${{ inputs.config }}
