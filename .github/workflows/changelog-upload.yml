name: Changelog upload

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to changelog.yml configuration file'
        type: string
        default: 'docs/changelog.yml'
      overwrite:
        description: >
          Pass --overwrite to docs-builder changelog upload so changed objects replace
          the remote copy. Default true so existing callers keep replacing. Set false
          to omit the flag; docs-builder then refuses replacements when the remote
          object differs.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: changelog-s3-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Upload changelog
        uses: elastic/docs-actions/changelog/upload@v1
        with:
          config: ${{ inputs.config }}
          overwrite: ${{ inputs.overwrite }}
