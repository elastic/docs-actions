          GH_AW_PROMPT_CONTENT_0002: "</safe-output-tools>\n"
          GH_AW_PROMPT_CONTENT_0003: "<github-context>\nThe following GitHub context information is available for this workflow:\n{{#if github.actor}}\n- **actor**: __GH_AW_GITHUB_ACTOR__\n{{/if}}\n{{#if github.repository}}\n- **repository**: __GH_AW_GITHUB_REPOSITORY__\n{{/if}}\n{{#if github.workspace}}\n- **workspace**: __GH_AW_GITHUB_WORKSPACE__\n{{/if}}\n{{#if github.event.issue.number || (github.aw.context.item_type == 'issue' && github.aw.context.item_number)}}\n- **issue-number**: #__GH_AW_EXPR_802A9F6A__\n{{/if}}\n{{#if github.event.discussion.number || (github.aw.context.item_type == 'discussion' && github.aw.context.item_number)}}\n- **discussion-number**: #__GH_AW_EXPR_1A3A194A__\n{{/if}}\n{{#if github.event.pull_request.number || (github.aw.context.item_type == 'pull_request' && github.aw.context.item_number)}}\n- **pull-request-number**: #__GH_AW_EXPR_463A214A__\n{{/if}}\n{{#if github.event.comment.id || github.aw.context.comment_id}}\n- **comment-id**: __GH_AW_EXPR_FF1D34CE__\n{{/if}}\n{{#if github.run_id}}\n- **workflow-run-id**: __GH_AW_GITHUB_RUN_ID__\n{{/if}}\n</github-context>\n\n"
          GH_AW_PROMPT_CONTENT_0004: "</system>\n"
          GH_AW_PROMPT_CONTENT_0005: "## Formatting Guidelines\n\n- Lead with the most important information — your first sentence should be the key takeaway\n- Be concise and actionable — no filler or praise\n- Use `<details>` and `<summary>` tags for long sections to keep responses scannable\n- Wrap branch names and @-references in backticks to avoid pinging users\n- Include code snippets with file paths and line numbers when referencing the codebase\n\n"
          GH_AW_PROMPT_CONTENT_0006: "## Rigor\n\n**Silence is better than noise. A false positive wastes a human's time and erodes trust in every future report.**\n\n- If you claim something is missing or broken, show the exact evidence in the code — file path, line number, and what you observed.\n- If a conclusion depends on assumptions you haven't confirmed, do not assert it. Verify first; if you cannot verify, do not report.\n- \"I don't know\" is better than a wrong answer. `noop` is better than a speculative finding.\n- It's worth the time to verify now versus guessing and forcing someone else to verify later.\n- Before filing any issue or opening any PR, re-read your own output as a skeptical reviewer. Ask: \"Would a senior engineer on this team find this useful, or would they close it immediately?\" If the answer is \"close,\" call `noop` instead.\n- Only report findings you would confidently defend in a code review. If you feel the need to hedge with \"might,\" \"could,\" or \"possibly,\" the finding is not ready to file.\n\n"
          GH_AW_PROMPT_CONTENT_0007: "## MCP Pagination\n\nMCP tool responses have a **25,000 token limit**. When responses exceed this limit, the call fails and you must retry with pagination — wasting turns and tokens. Use proactive pagination to stay under the limit.\n\n### Recommended `perPage` Values\n\n- **5-10**: For detailed items (PR diffs, files with patches, issues with comments)\n- **20-30**: For medium-detail lists (commits, review comments, issue lists)\n- **50-100**: For simple list operations (branches, labels, tags)\n\n### Pagination Pattern\n\nWhen you need all results from a paginated API:\n\n1. Fetch the first page with a conservative `perPage` value\n2. Process the results before fetching the next page\n3. Continue fetching pages until you receive fewer results than `perPage` (indicating the last page)\n\nIf you see `MCP tool response exceeds maximum allowed tokens`, retry with a smaller `perPage` value (halve it).\n\n"
          GH_AW_PROMPT_CONTENT_0008: "## Findings contract\n\nThese rules apply to every finding this sweep emits. Sweep output is consumed by humans and, increasingly, by AI fix-agents that may act on it without a human in the loop. A finding that is uncertain, or that looks authoritative but is wrong, is worse than no finding at all.\n\n### Finding-type allowlist\n\nEmit only the `category` values enumerated in this workflow's \"Build the findings list\" step. That enumeration is a closed allowlist:\n\n- Never invent, rename, pluralize, or otherwise vary a category string. If a finding does not map cleanly to an allowlisted category, drop it.\n- A finding is valid only if applying its `suggested_fix` would change the page's rendered output or its published metadata. Drop no-op findings whose fix a reader would never see — for example, adding a marker the docs toolchain already generates automatically.\n- If you spot something real that has no allowlisted category, describe it in the issue body's **Notes** section as prose. Do not smuggle it in as a finding under an invented category.\n\n### Per-finding confidence\n\nAdd a `confidence` field to every finding, set to exactly one of `high`, `medium`, or `low`. Judge confidence on how safe the finding is to act on *without* human verification — this is a separate axis from `severity`, which measures impact:\n\n- `high` — the problem and the fix are objective and verifiable from the evidence in front of you: a missing required field, a tool-flagged issue with a single unambiguous correction, a directly quoted contradiction. A fix-agent could apply the `suggested_fix` verbatim without judgment.\n- `medium` — the finding is well-supported, but the fix involves wording choices, or depends on a repository convention you could not fully verify this run. A human should confirm the fix before it lands.\n- `low` — the finding is plausible but rests on partial evidence, subjective judgment, or an assumption about intent or convention you could not confirm. If you cannot justify at least `low`, drop the finding rather than filing it.\n\nWhen a finding's evidence traces back to text you did not verify — for example, terminology copied from an issue or PR description rather than confirmed against the code or the published docs — cap its confidence at `low` and say so in the `evidence`.\n\nInclude `confidence` in the YAML schema for every finding, alongside `severity`. Keep the existing sort order (by `severity` first); do not reorder by confidence.\n\n### Human-review gate\n\nIf the capped findings list contains **any** finding with `confidence: medium` or `confidence: low`:\n\n1. Add the label `needs-human-review` to your `create_issue` call, in addition to the labels the workflow adds automatically. This marks the issue as not safe to auto-action and keeps it out of the `good-for-ai` delegation track.\n2. Immediately below the `## Findings (<count>)` heading and before the YAML block, add this callout verbatim:\n\n   > [!WARNING]\n   > This issue contains medium- or low-confidence findings. Review them before acting — auto-applying sweep output without verification risks putting incorrect content into the docs. Findings marked `confidence: high` are safe to delegate to a fix-agent; `medium` and `low` need a human sign-off first.\n\nIf every finding is `confidence: high`, do not add the label or the callout: the issue is safe to delegate as-is.\n\n"
          GH_AW_PROMPT_CONTENT_0009: "# Docs staleness sweep agent\n\nYou are a staleness reviewer for an Elastic documentation repository. Your job is to flag pages, screenshots, external links, and version mentions that have likely gone out of date — and emit a single labeled fix-issue with structured findings.\n\nThe hard work has already been done by deterministic pre-steps; your role is filtering false positives, prioritizing, and adding the version-mention judgment via the Elastic Docs MCP server.\n\n## Pre-fetched data\n\n- `/tmp/gh-aw/sweep-data/in-scope.txt` — file paths to audit.\n- `/tmp/gh-aw/sweep-data/scope/` — copies mirroring the original paths.\n- `/tmp/gh-aw/sweep-data/stats.json` — corpus stats.\n- `/tmp/gh-aw/sweep-data/staleness.json` — per-page git ages, image references, and `stale_content` / image-`stale` boolean flags. Contains a `thresholds` block describing the configured cutoffs.\n- `/tmp/gh-aw/sweep-data/lychee.json` — lychee output (`fail_map` keyed by source file → list of broken URLs).\n\nIf `in_scope_count` is `0`, call `noop` with a path-aware or shard-aware message based on `selection_mode`, then stop.\n\n## Step 1: Collect deterministic findings\n\nFrom `staleness.json`:\n\n- **`stale-content`** — every page where `stale_content` is `true`. `evidence` should cite the configured threshold (`thresholds.stale_content_months`) and the page's `age_months`.\n- **`stale-screenshot`** — every image entry where `stale` is `true`. `evidence` cites the `gap_months`.\n\nFrom `lychee.json`:\n\n- **`broken-external-link`** — every entry in `fail_map`. `file` is the source markdown; `line` is the line number from lychee (if present); `evidence` is the URL plus the failure reason.\n\nGroup all of these into the findings list directly; no LLM judgment needed. Apply the Rigor standards — drop anything where the evidence isn't concrete (a missing `line`, an ambiguous file path, etc.) rather than guessing. These three categories are deterministic — set `confidence: high` on every one (see the **Findings contract**).\n\n## Step 2: Add version-mention findings via MCP\n\nFor each in-scope page that has version-shaped tokens in its body (e.g., `8.x`, `7.17`, `9.0.0`, `Stack 7.x`), use the `elastic-docs` MCP server to determine whether the versions referenced are still supported:\n\n- `search_docs(query: \"supported versions Elastic Stack\")` once per run to cache the current support matrix.\n- For specific products (Kibana, Elasticsearch, Logstash, Beats, etc.), use `search_docs` with the product name to find its support page, then `get_document_by_url` to read the matrix.\n\nFlag a finding only when:\n\n- The version mentioned is below the published \"supported\" range (i.e., end-of-life), AND\n- The page is not itself a release-notes / changelog / upgrade-from-old-version page (those legitimately reference EOL versions).\n\nCategory: `unsupported-version-mention`. `evidence` cites the version token and the support-matrix source. Set `confidence: medium` when the support-matrix evidence is unambiguous, `low` when the page context leaves doubt (per the **Findings contract**); this is the only non-deterministic category this sweep emits. The complete category allowlist is `stale-content`, `stale-screenshot`, `broken-external-link`, and `unsupported-version-mention` — never emit any other category string.\n\nDo not invent versions or speculate about the support matrix when the MCP server doesn't return a clean answer. Skip the finding instead.\n\n## Step 3: Sort and cap\n\nSort findings by `severity` (`high` → `medium` → `low`), then by `category` (`broken-external-link` > `stale-content` > `unsupported-version-mention` > `stale-screenshot`), then by `file` ascending, then by `line` ascending.\n\n**Do not cap deterministic categories** — `broken-external-link`, `stale-content`, and `stale-screenshot` are produced verbatim by lychee and the python pre-step. Emit all of them. The reader can scan many deterministic findings; throwing them away costs an audit cycle and gives no value (these are not LLM judgments that need triage).\n\n**Cap only** the LLM-judgment category `unsupported-version-mention` at `__GH_AW_EXPR_CBA258AA__` findings. Overflow surfaces in the next sweep.\n\n**Hard upper bound for issue body length**: if the total findings list would exceed 400 rows (GitHub issue body limit ≈ 65,536 characters), cap at 400 and add a note `+M additional findings will surface in next sweep`. Apply this only if the deterministic-uncapped pass exceeds the bound.\n\nIf the combined output is empty, call `noop` and adapt the message to the selection mode:\n\n- Shard mode without `target_path`: `\"No staleness findings in this slice (shard <slot>/<n>, <in_scope_count> pages)\"`.\n- Shard mode with `target_path`: `\"No staleness findings under /<target_path> in shard <slot>/<n> (<in_scope_count> pages)\"`.\n- Full mode with `target_path`: `\"No staleness findings under /<target_path> (<in_scope_count> pages)\"`.\n- Full mode without `target_path`: `\"No staleness findings in full sweep <docs_root> (<in_scope_count> pages)\"`.\n- Files mode: `\"No staleness findings in the requested file list (<in_scope_count> files)\"`.\n\n**Files mode**: when `selection_mode` is `files`, the caller supplied an explicit file list via `target-files`; audit exactly those files and ignore `target_path`/shard framing. Use an explicit-file-list description in the title (`file list — <count> findings`) and scope-summary (`Explicit file list · <in_scope_count> of <requested_count> requested files in scope.`).\n\n## Output: fix-issue body\n\nTitle body depends on the selection mode:\n\n- Shard mode without `target_path`: `shard <slot+1>/<n> — <count> findings` (workflow prepends `Docs fix — staleness: `).\n- Shard mode with `target_path`: `path /<target_path> — shard <slot+1>/<n> — <count> findings`.\n- Full mode with `target_path`: `path /<target_path> — <count> findings`.\n- Full mode without `target_path`: `full <docs_root> — <count> findings`.\n\n```markdown\nGenerated by `gh-aw-docs-staleness-sweep` for `__GH_AW_EXPR_E6F7E87E__` on <iso_week>.\n\nUse one of these scope-summary lines:\n\n- Shard mode without `target_path`: `Shard <slot+1>/<n> · <shard_count> pages in slice · <recent_count> recently-changed · <in_scope_count> total in scope · corpus <total> pages.`\n- Shard mode with `target_path`: `Path /<target_path> · shard <slot+1>/<n> · <shard_count> pages in slice · <recent_count> recently-changed · <in_scope_count> total in scope · subtree corpus <total> pages.`\n- Full mode with `target_path`: `Path /<target_path> · <in_scope_count> total in scope · subtree corpus <total> pages.`\n- Full mode without `target_path`: `Full sweep of <docs_root> · <in_scope_count> total in scope · corpus <total> pages.`\nThresholds: stale_content_months=<n>, stale_image_min_gap_months=<n>.\n\n## Findings (<count>)\n\n```yaml\n- file: docs/foo.md\n  line: 1\n  category: stale-content\n  severity: medium\n  confidence: high\n  evidence: \"last commit 2023-01-15 (38 months ago); threshold is 24 months\"\n  suggested_fix: |\n    review and refresh; either update content or move to archive\n- file: docs/bar.md\n  line: 17\n  category: stale-screenshot\n  severity: low\n  confidence: high\n  evidence: \"image images/bar-ui.png last modified 12 months before page; gap exceeds 6-month threshold\"\n  suggested_fix: |\n    re-capture screenshot reflecting the current UI\n- file: docs/baz.md\n  line: 42\n  category: broken-external-link\n  severity: high\n  confidence: high\n  evidence: \"https://example.com/old-spec returned 404 (lychee)\"\n  suggested_fix: |\n    replace link or cite a current source\n- file: docs/qux.md\n  line: 9\n  category: unsupported-version-mention\n  severity: medium\n  confidence: medium\n  evidence: \"references Elastic Stack 7.17 — past EOL per support matrix at https://www.elastic.co/support/eol\"\n  suggested_fix: |\n    update to a currently-supported version or move guidance to upgrade docs\n```\n\n## Done when\n- Stale content has been refreshed, archived, or annotated as historical.\n- Stale screenshots are re-captured.\n- Broken external links are replaced with current sources.\n- Unsupported-version mentions are removed or moved to upgrade docs.\n- A PR addressing this issue is merged.\n\n## Notes\n- <Optional 1-line about MCP availability or anything intentionally skipped>.\n\n<!-- gh-aw-docs-staleness-sweep:run=<iso_week>:shard=<slot>/<n> -->\n```\n\n## What to skip\n\n- Files outside `/tmp/gh-aw/sweep-data/in-scope.txt`.\n- Internal (relative) link failures — those are docs-build's responsibility, not this sweep's.\n- Internal Elastic domain URLs — they were excluded from lychee deliberately; if you spot one in the input, do not fabricate a finding for it.\n- Release-notes / upgrade / changelog pages when flagging unsupported versions: those legitimately reference EOL versions.\n- Stale-screenshot findings for diagrams or non-UI illustrations where age doesn't imply staleness.\n\n__GH_AW_EXPR_49B959F1__\n\n"
        with:
          script: |
            const { setupGlobals } = require(process.env.GH_AW_ACTIONS_DIR + '/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(process.env.GH_AW_ACTIONS_DIR + '/create_prompt.cjs');
            await main(core);
      - name: Interpolate variables and render templates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_ENGINE_ID: "copilot"
          GH_AW_EXPR_49B959F1: ${{ inputs.additional-instructions }}
          GH_AW_EXPR_CBA258AA: ${{ inputs.max-per-fix-issue }}
          GH_AW_EXPR_E6F7E87E: ${{ inputs.source-repo || github.repository }}
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/interpolate_prompt.cjs');
            await main();
      - name: Substitute placeholders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_EXPR_1A3A194A: ${{ github.event.discussion.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'discussion' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_463A214A: ${{ github.event.pull_request.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'pull_request' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_49B959F1: ${{ inputs.additional-instructions }}
          GH_AW_EXPR_802A9F6A: ${{ github.event.issue.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'issue' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_CBA258AA: ${{ inputs.max-per-fix-issue }}
          GH_AW_EXPR_E6F7E87E: ${{ inputs.source-repo || github.repository }}
          GH_AW_EXPR_FF1D34CE: ${{ github.event.comment.id || fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').comment_id }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_MCP_CLI_SERVERS_LIST: "- `elastic-docs` — run `elastic-docs --help` to see available tools\n- `github` — run `github --help` to see available tools\n- `safeoutputs` — run `safeoutputs --help` to see available tools"
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: ${{ needs.pre_activation.outputs.activated }}
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);

            const substitutePlaceholders = require('${{ runner.temp }}/gh-aw/actions/substitute_placeholders.cjs');

            // Call the substitution function
            return await substitutePlaceholders({
              file: process.env.GH_AW_PROMPT,
              substitutions: {
                GH_AW_EXPR_1A3A194A: process.env.GH_AW_EXPR_1A3A194A,
                GH_AW_EXPR_463A214A: process.env.GH_AW_EXPR_463A214A,
                GH_AW_EXPR_49B959F1: process.env.GH_AW_EXPR_49B959F1,
                GH_AW_EXPR_802A9F6A: process.env.GH_AW_EXPR_802A9F6A,
                GH_AW_EXPR_CBA258AA: process.env.GH_AW_EXPR_CBA258AA,
                GH_AW_EXPR_E6F7E87E: process.env.GH_AW_EXPR_E6F7E87E,
                GH_AW_EXPR_FF1D34CE: process.env.GH_AW_EXPR_FF1D34CE,
                GH_AW_GITHUB_ACTOR: process.env.GH_AW_GITHUB_ACTOR,
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_RUN_ID: process.env.GH_AW_GITHUB_RUN_ID,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_MCP_CLI_SERVERS_LIST: process.env.GH_AW_MCP_CLI_SERVERS_LIST,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-prefix.outputs.prefix }}activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs: activation
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
      issues: read
    concurrency:
      group: "gh-aw-copilot-gh-aw-docs-staleness-sweep"
      queue: max
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: ghawdocsstalenesssweep
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-mcp-gateway.outputs.aic }}
      ambient_context: ${{ steps.parse-mcp-gateway.outputs.ambient_context }}
      artifact_prefix: ${{ needs.activation.outputs.artifact_prefix }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      effective_tokens: ${{ steps.parse-mcp-gateway.outputs.effective_tokens }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # v0.86.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Docs staleness sweep agent"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/gh-aw-docs-staleness-sweep.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.79"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_ENGINE_ID: "copilot"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Set runtime paths
        id: set-runtime-paths
        run: |
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}activation
          path: /tmp/gh-aw
      - name: Checkout source docs repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ inputs.source-repo || github.repository }}
      - env:
          DOCS_ROOT: ${{ inputs.docs-root }}
          SCOPE_MODE: ${{ inputs.scope-mode }}
          TARGET_BATCH: ${{ inputs.target-batch-size }}
          TARGET_FILES: ${{ inputs.target-files }}
          TARGET_PATH: ${{ inputs.target-path }}
        name: Compute sweep targets
        run: "set -eu\nmkdir -p /tmp/gh-aw/sweep-data/scope\n\nTARGET_PATH_CLEAN=${TARGET_PATH#/}\nTARGET_PATH_CLEAN=${TARGET_PATH_CLEAN%/}\nDOCS_ROOT_CLEAN=${DOCS_ROOT%/}\nSCOPE_ROOT=\"$DOCS_ROOT\"\nREQUESTED_SCOPE_MODE=\"$SCOPE_MODE\"\nSELECTION_MODE=\"shard\"\n\ncase \"$REQUESTED_SCOPE_MODE\" in\n  auto|full|shard) ;;\n  *)\n    echo \"scope-mode '$REQUESTED_SCOPE_MODE' must be one of: auto, full, shard\"\n    exit 1\n    ;;\nesac\n\n# target-files overrides target-path and scope-mode: audit exactly the\n# listed files (newline- or comma-separated, docs-root-relative).\nif [ -n \"$TARGET_FILES\" ]; then\n  SELECTION_MODE=\"files\"\n  : > /tmp/gh-aw/sweep-data/all.txt\n  : > /tmp/gh-aw/sweep-data/shard.txt\n  : > /tmp/gh-aw/sweep-data/recent.txt\n  : > /tmp/gh-aw/sweep-data/in-scope.txt\n\n  REQUESTED_COUNT=0\n  printf '%s' \"$TARGET_FILES\" | tr ',' '\\n' > /tmp/gh-aw/sweep-data/target-files.raw\n  while IFS= read -r raw || [ -n \"$raw\" ]; do\n    entry=$(printf '%s' \"$raw\" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')\n    [ -z \"$entry\" ] && continue\n    REQUESTED_COUNT=$(( REQUESTED_COUNT + 1 ))\n    entry=${entry#/}\n    if [ \"$DOCS_ROOT_CLEAN\" = \".\" ] || [ -z \"$DOCS_ROOT_CLEAN\" ]; then\n      resolved=\"$entry\"\n    else\n      case \"$entry\" in\n        \"$DOCS_ROOT_CLEAN\"/*) resolved=\"$entry\" ;;\n        *) resolved=\"$DOCS_ROOT_CLEAN/$entry\" ;;\n      esac\n    fi\n    if [ -f \"$resolved\" ]; then\n      echo \"$resolved\" >> /tmp/gh-aw/sweep-data/all.txt\n    else\n      echo \"target-files: '$resolved' not found; skipping\"\n    fi\n  done < /tmp/gh-aw/sweep-data/target-files.raw\n\n  sort -u /tmp/gh-aw/sweep-data/all.txt > /tmp/gh-aw/sweep-data/in-scope.txt\n  cp /tmp/gh-aw/sweep-data/in-scope.txt /tmp/gh-aw/sweep-data/all.txt\n\n  while IFS= read -r f; do\n    [ -z \"$f\" ] && continue\n    [ ! -f \"$f\" ] && continue\n    mkdir -p \"/tmp/gh-aw/sweep-data/scope/$(dirname \"$f\")\"\n    cp \"$f\" \"/tmp/gh-aw/sweep-data/scope/$f\"\n  done < /tmp/gh-aw/sweep-data/in-scope.txt\n\n  IN_SCOPE_COUNT=$(wc -l < /tmp/gh-aw/sweep-data/in-scope.txt | tr -d ' ')\ncat > /tmp/gh-aw/sweep-data/stats.json <<EOF\n{\n  \"total\": $IN_SCOPE_COUNT,\n  \"shard_n\": 1,\n  \"shard_slot\": 0,\n  \"shard_count\": $IN_SCOPE_COUNT,\n  \"recent_count\": 0,\n  \"in_scope_count\": $IN_SCOPE_COUNT,\n  \"requested_count\": $REQUESTED_COUNT,\n  \"iso_week\": \"$(date +%G-W%V)\",\n  \"docs_root\": \"$DOCS_ROOT\",\n  \"scope_mode\": \"files\",\n  \"selection_mode\": \"files\",\n  \"target_path\": \"$TARGET_PATH_CLEAN\",\n  \"scope_root\": \"$DOCS_ROOT_CLEAN\"\n}\nEOF\n  echo \"Sweep targets (file list): requested=$REQUESTED_COUNT in_scope=$IN_SCOPE_COUNT\"\n  exit 0\nfi\n\nif [ -n \"$TARGET_PATH_CLEAN\" ]; then\n  if [ \"$DOCS_ROOT_CLEAN\" = \".\" ] || [ -z \"$DOCS_ROOT_CLEAN\" ]; then\n    SCOPE_ROOT=\"$TARGET_PATH_CLEAN\"\n  else\n    SCOPE_ROOT=\"$DOCS_ROOT_CLEAN/$TARGET_PATH_CLEAN\"\n  fi\nfi\n\nif [ \"$REQUESTED_SCOPE_MODE\" = \"auto\" ]; then\n  if [ -n \"$TARGET_PATH_CLEAN\" ]; then\n    SELECTION_MODE=\"full\"\n  else\n    SELECTION_MODE=\"shard\"\n  fi\nelse\n  SELECTION_MODE=\"$REQUESTED_SCOPE_MODE\"\nfi\n\nif [ ! -d \"$SCOPE_ROOT\" ]; then\n  echo \"scope root '$SCOPE_ROOT' does not exist; producing empty scope\"\n  : > /tmp/gh-aw/sweep-data/all.txt\n  : > /tmp/gh-aw/sweep-data/shard.txt\n  : > /tmp/gh-aw/sweep-data/recent.txt\n  : > /tmp/gh-aw/sweep-data/in-scope.txt\n  echo '{\"total\":0,\"shard_n\":1,\"shard_slot\":0,\"shard_count\":0,\"recent_count\":0,\"in_scope_count\":0,\"iso_week\":\"'\"$(date +%G-W%V)\"'\",\"docs_root\":\"'\"$DOCS_ROOT\"'\",\"scope_mode\":\"'\"$REQUESTED_SCOPE_MODE\"'\",\"selection_mode\":\"'\"$SELECTION_MODE\"'\",\"target_path\":\"'\"$TARGET_PATH_CLEAN\"'\",\"scope_root\":\"'\"$SCOPE_ROOT\"'\"}' > /tmp/gh-aw/sweep-data/stats.json\n  exit 0\nfi\n\nfind \"$SCOPE_ROOT\" -type f -name '*.md' \\\n  -not -path '*/node_modules/*' \\\n  -not -path '*/.git/*' \\\n  | sort > /tmp/gh-aw/sweep-data/all.txt\n\nTOTAL=$(wc -l < /tmp/gh-aw/sweep-data/all.txt | tr -d ' ')\nif [ \"$SELECTION_MODE\" = \"full\" ]; then\n  N=1\n  SLOT=0\n  cp /tmp/gh-aw/sweep-data/all.txt /tmp/gh-aw/sweep-data/shard.txt\n  : > /tmp/gh-aw/sweep-data/recent.txt\nelse\n  if [ \"$TOTAL\" -eq 0 ]; then\n    N=1\n  else\n    N=$(( (TOTAL + TARGET_BATCH - 1) / TARGET_BATCH ))\n  fi\n  ISO_WEEK_NUM=$(date +%V | sed 's/^0//')\n  SLOT=$(( ISO_WEEK_NUM % N ))\n\n  : > /tmp/gh-aw/sweep-data/shard.txt\n  while IFS= read -r f; do\n    [ -z \"$f\" ] && continue\n    HEX=$(printf '%s' \"$f\" | shasum -a 256 | cut -c1-4)\n    HASH_NUM=$(( 16#$HEX ))\n    if [ $((HASH_NUM % N)) -eq \"$SLOT\" ]; then\n      echo \"$f\" >> /tmp/gh-aw/sweep-data/shard.txt\n    fi\n  done < /tmp/gh-aw/sweep-data/all.txt\n\n  git log --since='2 days ago' --name-only --pretty=format: -- \"$DOCS_ROOT/*.md\" \"$DOCS_ROOT/**/*.md\" 2>/dev/null \\\n    | grep -E '\\.md$' \\\n    | sort -u > /tmp/gh-aw/sweep-data/recent.txt || true\n\n  # Cap the recently-changed pass: if a corpus-wide rebase or migration\n  # touched far more pages than one slice, fall back to slice-only so\n  # rotation actually rotates.\n  RECENT_RAW=$(wc -l < /tmp/gh-aw/sweep-data/recent.txt | tr -d ' ')\n  RECENT_LIMIT=$(( TARGET_BATCH * 2 ))\n  if [ \"$RECENT_RAW\" -gt \"$RECENT_LIMIT\" ]; then\n    echo \"recently-changed pass produced $RECENT_RAW pages (>2x target batch $TARGET_BATCH); disabling for this run\"\n    : > /tmp/gh-aw/sweep-data/recent.txt\n  fi\nfi\n\nif [ \"$SELECTION_MODE\" = \"full\" ]; then\n  cp /tmp/gh-aw/sweep-data/all.txt /tmp/gh-aw/sweep-data/in-scope.txt\nelse\n  sort -u /tmp/gh-aw/sweep-data/shard.txt /tmp/gh-aw/sweep-data/recent.txt \\\n    | grep -v '^$' > /tmp/gh-aw/sweep-data/in-scope.txt || true\nfi\n\nwhile IFS= read -r f; do\n  [ -z \"$f\" ] && continue\n  [ ! -f \"$f\" ] && continue\n  mkdir -p \"/tmp/gh-aw/sweep-data/scope/$(dirname \"$f\")\"\n  cp \"$f\" \"/tmp/gh-aw/sweep-data/scope/$f\"\ndone < /tmp/gh-aw/sweep-data/in-scope.txt\n\nSHARD_COUNT=$(wc -l < /tmp/gh-aw/sweep-data/shard.txt | tr -d ' ')\nRECENT_COUNT=$(wc -l < /tmp/gh-aw/sweep-data/recent.txt | tr -d ' ')\nIN_SCOPE_COUNT=$(wc -l < /tmp/gh-aw/sweep-data/in-scope.txt | tr -d ' ')\n\ncat > /tmp/gh-aw/sweep-data/stats.json <<EOF\n{\n  \"total\": $TOTAL,\n  \"shard_n\": $N,\n  \"shard_slot\": $SLOT,\n  \"shard_count\": $SHARD_COUNT,\n  \"recent_count\": $RECENT_COUNT,\n  \"in_scope_count\": $IN_SCOPE_COUNT,\n  \"iso_week\": \"$(date +%G-W%V)\",\n  \"docs_root\": \"$DOCS_ROOT\",\n  \"scope_mode\": \"$REQUESTED_SCOPE_MODE\",\n  \"selection_mode\": \"$SELECTION_MODE\",\n  \"target_path\": \"$TARGET_PATH_CLEAN\",\n  \"scope_root\": \"$SCOPE_ROOT\"\n}\nEOF\n\necho \"Sweep targets: scope_mode=$REQUESTED_SCOPE_MODE mode=$SELECTION_MODE scope_root=$SCOPE_ROOT total=$TOTAL N=$N slot=$SLOT shard=$SHARD_COUNT recent=$RECENT_COUNT in_scope=$IN_SCOPE_COUNT\"\n"
      - env:
          STALE_CONTENT_MONTHS: ${{ inputs.stale-content-months }}
          STALE_IMAGE_MIN_GAP_MONTHS: ${{ inputs.stale-screenshot-min-gap-months }}
        name: Compute per-page git ages and image references
        run: "set -eu\n\nif [ ! -s /tmp/gh-aw/sweep-data/in-scope.txt ]; then\n  echo '{\"pages\":[],\"thresholds\":{\"stale_content_months\":'\"$STALE_CONTENT_MONTHS\"',\"stale_image_min_gap_months\":'\"$STALE_IMAGE_MIN_GAP_MONTHS\"'}}' > /tmp/gh-aw/sweep-data/staleness.json\n  exit 0\nfi\n\npython3 - <<'PY'\nimport json, os, re, subprocess, datetime, pathlib\n\nstale_content_months = int(os.environ[\"STALE_CONTENT_MONTHS\"])\nstale_image_gap_months = int(os.environ[\"STALE_IMAGE_MIN_GAP_MONTHS\"])\n\nwith open(\"/tmp/gh-aw/sweep-data/in-scope.txt\") as f:\n    pages = [l.strip() for l in f if l.strip()]\n\ndef last_commit_date(p):\n    try:\n        out = subprocess.run(\n            [\"git\", \"log\", \"-1\", \"--format=%cs\", \"--\", p],\n            capture_output=True, text=True, check=True,\n        ).stdout.strip()\n        return out or None\n    except subprocess.CalledProcessError:\n        return None\n\nimg_re = re.compile(r'!\\[[^\\]]*\\]\\(([^)]+)\\)|<img\\s[^>]*src=\"([^\"]+)\"', re.IGNORECASE)\ntoday = datetime.date.today()\n\ndef months_between(a, b):\n    return (a.year - b.year) * 12 + (a.month - b.month)\n\ndef parse_date(s):\n    try:\n        return datetime.date.fromisoformat(s)\n    except Exception:\n        return None\n\nout = []\nfor p in pages:\n    page_date_str = last_commit_date(p)\n    page_date = parse_date(page_date_str) if page_date_str else None\n    age_months = months_between(today, page_date) if page_date else None\n\n    stale_content = age_months is not None and age_months >= stale_content_months\n\n    images = []\n    try:\n        with open(p, \"r\", encoding=\"utf-8\", errors=\"replace\") as fh:\n            text = fh.read()\n        for m in img_re.finditer(text):\n            ref = m.group(1) or m.group(2)\n            if not ref:\n                continue\n            if ref.startswith((\"http://\", \"https://\", \"data:\")):\n                continue\n            ref_clean = ref.split(\"?\", 1)[0].split(\"#\", 1)[0].strip()\n            if not ref_clean:\n                continue\n            resolved = ref_clean\n            if not resolved.startswith(\"/\"):\n                resolved = os.path.normpath(os.path.join(os.path.dirname(p), ref_clean))\n            if not os.path.isfile(resolved):\n                continue\n            img_date_str = last_commit_date(resolved)\n            img_date = parse_date(img_date_str) if img_date_str else None\n            gap = None\n            if img_date and page_date:\n                gap = months_between(page_date, img_date)\n            flag = (gap is not None) and (gap >= stale_image_gap_months)\n            images.append({\n                \"ref\": ref_clean,\n                \"resolved\": resolved,\n                \"image_last_commit\": img_date_str,\n                \"page_last_commit\": page_date_str,\n                \"gap_months\": gap,\n                \"stale\": flag,\n            })\n    except Exception as e:\n        images.append({\"error\": str(e)})\n\n    out.append({\n        \"file\": p,\n        \"last_commit\": page_date_str,\n        \"age_months\": age_months,\n        \"stale_content\": stale_content,\n        \"images\": images,\n    })\n\npayload = {\n    \"thresholds\": {\n        \"stale_content_months\": stale_content_months,\n        \"stale_image_min_gap_months\": stale_image_gap_months,\n    },\n    \"pages\": out,\n}\nwith open(\"/tmp/gh-aw/sweep-data/staleness.json\", \"w\") as fh:\n    json.dump(payload, fh, indent=2)\n\nstale_pages = sum(1 for p in out if p[\"stale_content\"])\nstale_imgs = sum(1 for p in out for img in p[\"images\"] if img.get(\"stale\"))\nprint(f\"Staleness: pages={len(out)} stale_content={stale_pages} stale_images={stale_imgs}\")\nPY\n"
      - env:
          LYCHEE_CONFIG: ${{ inputs.lychee-config }}
        name: Run lychee on slice
        run: "set -u\n\nif [ ! -s /tmp/gh-aw/sweep-data/in-scope.txt ]; then\n  echo '{\"failed_urls\":[]}' > /tmp/gh-aw/sweep-data/lychee.json\n  exit 0\nfi\n\nLYCHEE_VERSION=\"0.18.1\"\ncurl -sSL \"https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz\" \\\n  -o /tmp/lychee.tar.gz\ntar -xz -C /tmp -f /tmp/lychee.tar.gz\nchmod +x /tmp/lychee\n\nLYCHEE_FLAGS=(\n  --no-progress\n  --format json\n  --include-fragments\n  --max-concurrency 8\n  --timeout 20\n  --max-retries 1\n  --exclude '^https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)'\n  --exclude '^https?://[^/]*\\.elastic\\.co'\n  --output /tmp/gh-aw/sweep-data/lychee.json\n)\nif [ -n \"$LYCHEE_CONFIG\" ] && [ -f \"$LYCHEE_CONFIG\" ]; then\n  LYCHEE_FLAGS+=(--config \"$LYCHEE_CONFIG\")\nfi\n\nset +e\nxargs -a /tmp/gh-aw/sweep-data/in-scope.txt /tmp/lychee \"${LYCHEE_FLAGS[@]}\"\nRC=$?\nset -e\n\nif [ ! -f /tmp/gh-aw/sweep-data/lychee.json ]; then\n  echo '{\"failed_urls\":[],\"note\":\"lychee produced no output\"}' > /tmp/gh-aw/sweep-data/lychee.json\nfi\n\nFAILED=$(jq '.fail_map // {} | to_entries | map(.value | length) | add // 0' /tmp/gh-aw/sweep-data/lychee.json 2>/dev/null || echo 0)\necho \"Lychee exit=$RC failed_urls=$FAILED\"\n"
      - env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        if: ${{ inputs.setup-commands != '' }}
        name: Repo-specific setup
        run: eval "$SETUP_COMMANDS"

      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
