name: Recompile gh-aw lock files on Dependabot PRs

on:
  pull_request:
    paths:
      - '.github/workflows/gh-aw-*.lock.yml'

permissions:
  contents: read

jobs:
  recompile:
    if: github.actor == 'dependabot[bot]'
    name: Recompile gh-aw lock files
    runs-on: ubuntu-latest
    env:
      GH_AW_VERSION: v0.71.1
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Create ephemeral GitHub token
        id: create-token
        uses: elastic/oblt-actions/github/create-token@v1.38.1
        with:
          token-policy: token-policy-8749eaab83f2

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.create-token.outputs.token }}

      - name: Install gh-aw and compile
        run: |
          gh extension install github/gh-aw --pin "$GH_AW_VERSION"
          gh aw compile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- .github/workflows/*.lock.yml; then
            echo "Lock files already match a fresh compile."
            exit 0
          fi
          git config user.name "elasticmachine"
          git config user.email "elasticmachine@users.noreply.github.com"
          git add .github/workflows/*.lock.yml
          git commit -m "Recompile gh-aw lock files after Dependabot bump"
          git push
