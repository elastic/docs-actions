name: Changelog submit

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to changelog.yml configuration file'
        type: string
        default: 'docs/changelog.yml'
      comment-only:
        description: 'Post changelog as a PR comment instead of committing to the branch'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: changelog-submit-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  submit:
    if: >
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Fetch ephemeral GitHub token
        continue-on-error: true
        id: fetch-ephemeral-token
        uses: elastic/ci-gh-actions/fetch-github-token@v1
        with:
          vault-instance: "ci-prod"
          vault-role: "token-policy-docs-changelog-submit-org-member-check"

      - name: Submit changelog
        uses: elastic/docs-actions/changelog/submit@v1
        with:
          config: ${{ inputs.config }}
          comment-only: ${{ inputs.comment-only }}
          org-check-token: ${{ steps.fetch-ephemeral-token.outputs.token }}
