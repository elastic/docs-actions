name: Docs Deploy

on:
  workflow_call:
    inputs:
      strict:
        description: 'Treat warnings as errors'
        type: string
        default: 'true'
      continue-on-error:
        description: 'Do not fail if build fails'
        type: string
        required: false
        default: 'false'
      path-pattern:
        description: 'Path pattern to filter files (should match Phase 1 setting)'
        type: string
        default: 'docs/**'
        required: false
      path-pattern-ignore:
        description: 'Path pattern to ignore files (should match Phase 1 setting)'
        type: string
        default: ''
        required: false
      disable-comments:
        description: 'Disable PR preview comments'
        type: boolean
        default: false
        required: false
      enable-cumulative-comment:
        description: 'Enable the cumulative docs versioning reminder comment'
        type: boolean
        default: false
        required: false
      enable-vale-linting:
        description: 'Enable vale linting report'
        type: boolean
        default: false
        required: false
      vale-paths:
        description: 'Path patterns for Vale linting (must match docs-build include-paths). Only PRs touching matching files will trigger vale-report.'
        type: string
        default: ''
        required: false
      use-release-branches:
        description: >
          When true, update-link-index runs for semver release branches (e.g. 9.4) as well as the default branch.
          Pair with the same flag on docs-build so links.json is produced when a release branch is first created.
        type: boolean
        default: false
        required: false

permissions: {}

concurrency:
  group: docs-deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: none
      pull-requests: read
      id-token: write
    outputs:
      should-deploy: ${{ steps.evaluate.outputs.should-deploy }}
      content-source-match: ${{ steps.match.outputs.content-source-match }}
      event: ${{ steps.context.outputs.event }}
      pr-number: ${{ steps.context.outputs.pr-number }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      head-branch: ${{ steps.context.outputs.head-branch }}
      head-repo: ${{ steps.context.outputs.head-repo }}
      is-fork: ${{ steps.context.outputs.is-fork }}
      base-ref: ${{ steps.context.outputs.base-ref }}
      is-org-member: ${{ steps.check-org-membership.outputs.is-member }}
      vale-files-match: ${{ steps.context.outputs.vale-files-match }}
      link-index-eligible: ${{ steps.link-index-branch.outputs.eligible }}
    steps:
      - name: Download check metadata
        id: download-metadata
        if: github.event.workflow_run.event == 'push'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-build-check-metadata
          run-id: ${{ github.event.workflow_run.id }}
          path: /tmp/check-metadata
          github-token: ${{ github.token }}

      - name: Resolve workflow run context
        id: context
        uses: actions/github-script@v9
        env:
          PATH_PATTERN: ${{ inputs.path-pattern }}
          IGNORE_PATTERNS: |
            ${{ inputs.path-pattern-ignore }}
            .github/**
            README.md
          VALE_PATHS: ${{ inputs.vale-paths }}
        with:
          # language=js
          script: |
            const run = context.payload.workflow_run;
            const event = run.event;
            const headSha = run.head_sha;
            const headBranch = run.head_branch;
            const headRepo = run.head_repository.full_name;
            const { owner, repo } = context.repo;
            const isFork = headRepo !== `${owner}/${repo}`;

            core.setOutput('event', event);
            core.setOutput('head-sha', headSha);
            core.setOutput('head-branch', headBranch);
            core.setOutput('head-repo', headRepo);
            core.setOutput('is-fork', isFork ? 'true' : 'false');

            if (event === 'push') {
              core.setOutput('base-ref', headBranch);
              core.setOutput('vale-files-match', 'false');

              let hasChanges = 'true';
              try {
                const fs = require('fs');
                const value = fs.readFileSync('/tmp/check-metadata/effective_any_modified', 'utf8').trim();
                hasChanges = value === 'false' ? 'false' : 'true';
                core.info(`Push has-changes from docs-build metadata: ${hasChanges}`);
              } catch (err) {
                core.warning(`Could not read check metadata: ${err.message} — falling back to has-changes=true`);
              }

              core.setOutput('has-changes', hasChanges);
              return;
            }

            if (event !== 'pull_request') {
              core.info(`Event '${event}' is not deployable — skipping`);
              core.setOutput('has-changes', 'false');
              core.setOutput('vale-files-match', 'false');
              return;
            }

            // --- PR resolution ---
            let prNumber;
            if (run.pull_requests?.length > 0) {
              prNumber = run.pull_requests[0].number;
              core.info(`Resolved PR #${prNumber} from workflow_run.pull_requests`);
            } else {
              const headLabel = `${run.head_repository.owner.login}:${headBranch}`;
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: headLabel
              });
              const match = prs.find(pr => pr.head.sha === headSha);
              if (match) {
                prNumber = match.number;
                core.info(`Resolved PR #${prNumber} via pulls.list fallback`);
              }
            }

            if (!prNumber) {
              core.warning('Could not resolve PR number — skipping deployment');
              core.setOutput('has-changes', 'false');
              core.setOutput('vale-files-match', 'false');
              return;
            }

            core.setOutput('pr-number', prNumber);

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber
            });
            core.setOutput('base-ref', pr.base.ref);
            core.setOutput('pr-author', pr.user.login);

            // --- Changed-files check (docs-relevant files only) ---
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber
            });

            const pathPattern = process.env.PATH_PATTERN || '**';
            const ignoreLines = (process.env.IGNORE_PATTERNS || '')
              .split('\n').map(s => s.trim()).filter(Boolean);

            const matchesPattern = (filename) => {
              if (pathPattern === '**' || pathPattern === '') return true;
              if (pathPattern.endsWith('/**')) {
                return filename.startsWith(pathPattern.slice(0, -3) + '/');
              }
              return true;
            };

            const isIgnored = (filename) => {
              for (const pattern of ignoreLines) {
                if (pattern.endsWith('/**')) {
                  if (filename.startsWith(pattern.slice(0, -3) + '/')) return true;
                } else if (pattern.endsWith('/*')) {
                  const dir = pattern.slice(0, -2);
                  if (filename.startsWith(dir + '/') && !filename.slice(dir.length + 1).includes('/')) return true;
                } else if (filename === pattern) {
                  return true;
                }
              }
              return false;
            };

            const hasChanges = files.some(f => matchesPattern(f.filename) && !isIgnored(f.filename));
            core.setOutput('has-changes', hasChanges ? 'true' : 'false');

            // --- Vale files check (vale-paths filtering) ---
            const valePathLines = (process.env.VALE_PATHS || '')
              .split('\n').map(s => s.trim()).filter(Boolean);

            let valeFilesMatch;
            if (valePathLines.length === 0) {
              valeFilesMatch = hasChanges;
            } else {
              const valeIncludes = valePathLines.filter(p => !p.startsWith('!'));
              const valeExcludes = valePathLines.filter(p => p.startsWith('!')).map(p => p.slice(1));
              const matchesVale = (filename) => {
                const matchesGlob = (f, pattern) => {
                  if (pattern.endsWith('/**')) return f.startsWith(pattern.slice(0, -3) + '/');
                  if (pattern.endsWith('/*')) {
                    const dir = pattern.slice(0, -2);
                    return f.startsWith(dir + '/') && !f.slice(dir.length + 1).includes('/');
                  }
                  return f === pattern;
                };
                const included = valeIncludes.length === 0 || valeIncludes.some(p => matchesGlob(filename, p));
                const excluded = valeExcludes.some(p => matchesGlob(filename, p));
                return included && !excluded;
              };
              valeFilesMatch = files.some(f => matchesVale(f.filename) && !isIgnored(f.filename));
            }
            core.setOutput('vale-files-match', valeFilesMatch ? 'true' : 'false');

      - name: Match content source
        id: match
        if: steps.context.outputs.has-changes == 'true'
        uses: elastic/docs-builder/actions/assembler-match@main
        with:
          ref_name: ${{ steps.context.outputs.base-ref }}
          repository: ${{ github.repository }}

      - name: Fetch ephemeral GitHub token
        if: steps.context.outputs.is-fork == 'true' && steps.context.outputs.event == 'pull_request'
        continue-on-error: true
        id: fetch-ephemeral-token
        uses: elastic/ci-gh-actions/fetch-github-token@v1.5.3
        with:
          vault-instance: "ci-prod"
          vault-role: "token-policy-8c6a5ed19135"

      - name: Check org membership
        id: check-org-membership
        if: steps.context.outputs.is-fork == 'true' && steps.context.outputs.event == 'pull_request'
        uses: elastic/docs-actions/github/is-elastic-org-member@v1
        with:
          username: ${{ steps.context.outputs.pr-author }}
          token: ${{ steps.fetch-ephemeral-token.outputs.token }}

      - name: Evaluate
        id: evaluate
        env:
          MATCH: ${{ steps.match.outputs.content-source-match }}
          CHANGES: ${{ steps.context.outputs.has-changes }}
          IS_FORK: ${{ steps.context.outputs.is-fork }}
          EVENT: ${{ steps.context.outputs.event }}
          IS_ORG_MEMBER: ${{ steps.check-org-membership.outputs.is-member }}
        # language=bash
        run: |
          if [[ "$EVENT" == "pull_request" && "$IS_FORK" == "true" ]]; then
            if [[ "$IS_ORG_MEMBER" != "true" ]]; then
              echo "should-deploy=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Deploy skipped — fork PRs from non-members are not deployed"
              exit 0
            fi
          fi

          if [[ "$MATCH" == "true" && "$CHANGES" == "true" ]]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped (match=${MATCH}, changes=${CHANGES})"
          fi

      - name: Link index branch eligibility
        id: link-index-branch
        env:
          HEAD_BRANCH: ${{ steps.context.outputs.head-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          USE_RELEASE: ${{ inputs.use-release-branches }}
        run: |
          eligible=false
          if [[ "$HEAD_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            eligible=true
          elif [[ "${USE_RELEASE}" == "true" ]] && [[ "$HEAD_BRANCH" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            eligible=true
          fi
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"

  # Updates (or creates) the preview PR comment to show an in-progress indicator.
  # Runs in parallel with build so reviewers see feedback immediately — the
  # deploy workflow isn't visible as a PR check since it triggers on workflow_run.
  pre-comment:
    needs: preflight
    if: >
      needs.preflight.outputs.event == 'pull_request'
      && (needs.preflight.outputs.is-fork == 'false'
          || needs.preflight.outputs.is-org-member == 'true')
      && needs.preflight.outputs.should-deploy == 'true'
      && inputs.disable-comments != true
    runs-on: ubuntu-latest
    permissions:
      contents: none
      deployments: none
      id-token: none
      pull-requests: write
    steps:
      - name: Update comment to in-progress
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
        with:
          # language=js
          script: |
            const title = '## 🔍 Preview links for changed docs'
            const { owner, repo } = context.repo;
            const prNumber = parseInt(process.env.PR_NUMBER);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = [
              title,
              '',
              `⏳ Building and deploying preview... [View progress](${runUrl})`,
              '',
              '_This comment will be updated with preview links when the build is complete._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.startsWith(title)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body,
              });
            }

  # Builds documentation in an unprivileged context. This job has NO access to
  # id-token, deployments, or secrets. Even if docs-builder has an RCE triggered
  # by malicious content, there are no credentials to steal on this runner.
  #
  # Future optimization: run docs-builder via Docker with --network none to also
  # prevent data exfiltration. Requires a `docs-builder init` command to preload
  # the link index before the network-isolated build.
  build:
    needs: preflight
    if: needs.preflight.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_outcome: ${{ steps.docs-build.outcome == 'success' && 'success' || '' }}
      skip: ${{ steps.docs-build.outputs.skip }}
      path_prefix: ${{ steps.generate-path-prefix.outputs.result }}
      landing_page_path: ${{ steps.docs-build.outputs.landing-page-path || steps.generate-path-prefix.outputs.result }}
      links_uploaded: ${{ steps.upload-links.outcome == 'success' && 'true' || 'false' }}
    env:
      EVENT: ${{ needs.preflight.outputs.event }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
      HEAD_SHA: ${{ needs.preflight.outputs.head-sha }}
      HEAD_BRANCH: ${{ needs.preflight.outputs.head-branch }}
      HEAD_REPO: ${{ needs.preflight.outputs.head-repo }}
    steps:
      - name: Reject fork checkout
        if: >
          needs.preflight.outputs.is-fork == 'true'
          && needs.preflight.outputs.is-org-member != 'true'
        # language=bash
        run: |
          echo "::error::Fork code must never be checked out in the deploy workflow"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.preflight.outputs.head-repo }}
          ref: ${{ needs.preflight.outputs.head-sha }}
          persist-credentials: false

      - name: Validate checkout SHA
        # language=bash
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [[ "$ACTUAL_SHA" != "$HEAD_SHA" ]]; then
            echo "::error::Checkout SHA mismatch: expected ${HEAD_SHA}, got ${ACTUAL_SHA}. The branch may have been updated since the build was triggered."
            exit 1
          fi

      - name: Generate env.PATH_PREFIX
        id: generate-path-prefix
        # language=bash
        run: |
          if [[ ! "$HEAD_BRANCH" =~ ^[a-zA-Z0-9._/+-]+$ ]]; then
            echo "::error::Branch name contains disallowed characters: ${HEAD_BRANCH}"
            exit 1
          fi

          case "${EVENT}" in
            "pull_request")
              path_prefix="/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
              ;;
            "push" | "workflow_dispatch")
              path_prefix="/${GITHUB_REPOSITORY}/tree/${HEAD_BRANCH}"
              ;;
            *)
              echo "Unsupported event: '${EVENT}'";
              exit 1;
              ;;
          esac
          echo "PATH_PREFIX=${path_prefix}" >> "$GITHUB_ENV"
          echo "result=${path_prefix}" >> "$GITHUB_OUTPUT"

      # Run docs-builder in Docker isolation. Only explicitly listed env vars are
      # passed to the container — ACTIONS_RUNTIME_TOKEN, ACTIONS_CACHE_URL, and
      # OIDC env vars are excluded to prevent cache poisoning and credential
      # theft if the build tool is compromised via malicious content.
      #
      # Future: add --network none once docs-builder has an init command to
      # preload the link index before the build.
      - name: Build documentation
        id: docs-build
        continue-on-error: ${{ fromJSON(inputs.continue-on-error != '' && inputs.continue-on-error || 'false') }}
        # language=bash
        run: |
          CONTAINER_OUTPUT=$(mktemp)
          EXIT_CODE=0

          docker run --rm \
            -v "${PWD}:/github/workspace" \
            -w /github/workspace \
            -v "${CONTAINER_OUTPUT}:/github_output" \
            -e GITHUB_OUTPUT=/github_output \
            -e GITHUB_ACTIONS=true \
            -e CI=true \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_REPOSITORY="${HEAD_REPO}" \
            -e GITHUB_REF_NAME="${HEAD_BRANCH}" \
            -e GITHUB_REF="refs/heads/${HEAD_BRANCH}" \
            -e INPUT_PREFIX="${PATH_PREFIX}" \
            -e INPUT_STRICT="${STRICT_FLAG}" \
            ghcr.io/elastic/docs-builder:edge || EXIT_CODE=$?

          if [ -s "$CONTAINER_OUTPUT" ]; then
            cat "$CONTAINER_OUTPUT" >> "$GITHUB_OUTPUT"
          fi

          exit $EXIT_CODE
        env:
          STRICT_FLAG: ${{ fromJSON(inputs.strict != '' && inputs.strict || 'true') }}

      - name: Upload links artifact
        id: upload-links
        if: >
          env.EVENT == 'push'
          && steps.docs-build.outcome == 'success'
          && steps.docs-build.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: links
          path: .artifacts/docs/html/links.json
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

      - name: Upload docs artifact
        id: upload-docs
        if: >
          steps.docs-build.outcome == 'success'
          && steps.docs-build.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: .artifacts/docs/html
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  # Deploys the build output to S3 and manages GitHub deployments. This job has
  # elevated permissions (id-token for AWS OIDC, deployments for GitHub) but
  # never checks out or executes untrusted code — it only processes artifacts
  # produced by the unprivileged build job above.
  deploy-preview:
    needs:
      - preflight
      - build
    if: >
      needs.build.outputs.build_outcome == 'success'
      && needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: none
      deployments: write
      id-token: write
    outputs:
      deployed: ${{ steps.s3-upload.outcome == 'success' && 'true' || 'false' }}
    env:
      EVENT: ${{ needs.preflight.outputs.event }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
      HEAD_SHA: ${{ needs.preflight.outputs.head-sha }}
      PATH_PREFIX: ${{ needs.build.outputs.path_prefix }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs-html

      - name: Reject symlinks in build output
        run: |
          if find docs-html -type l | grep -q .; then
            echo "::error::Symlinks found in build output — refusing to deploy"
            find docs-html -type l -ls
            exit 1
          fi

      - name: Create Deployment
        if: env.EVENT == 'pull_request'
        uses: actions/github-script@v9
        id: deployment
        with:
          result-encoding: string
          # language=js
          script: |
            const { owner, repo } = context.repo;
            const prNumber = process.env.PR_NUMBER;
            const environment = 'docs-preview';
            const task = prNumber ? `docs-preview-${prNumber}` : undefined;
            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              environment,
              task,
              ref: process.env.HEAD_SHA,
              auto_merge: false,
              transient_environment: true,
              // Required: preview deployments target in-progress PR SHAs that
              // won't have passing status checks yet. Without this override
              // the API rejects the deployment when branch protection is enabled.
              required_contexts: [],
            })
            await github.rest.repos.createDeploymentStatus({
              deployment_id: deployment.data.id,
              owner,
              repo,
              state: "in_progress",
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            return deployment.data.id

      - uses: elastic/docs-actions/aws/auth@v1

      - name: Upload to S3
        id: s3-upload
        env:
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 6
        # language=bash
        run: |
          aws s3 sync docs-html "s3://elastic-docs-v3-website-preview${PATH_PREFIX}" --delete --no-follow-symlinks
          aws cloudfront create-invalidation \
            --distribution-id EKT7LT5PM8RKS \
            --paths "${PATH_PREFIX}" "${PATH_PREFIX}/*"

      - name: Update deployment status
        if: always() && steps.deployment.outputs.result
        uses: actions/github-script@v9
        env:
          LANDING_PAGE_PATH: ${{ needs.build.outputs.landing_page_path }}
        with:
          # language=js
          script: | # zizmor: ignore[template-injection] deployment_id from prior step output
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: "${{ steps.s3-upload.outcome == 'success' && 'success' || 'failure' }}",
              environment_url: `https://docs-v3-preview.elastic.dev${process.env.LANDING_PAGE_PATH}`,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  comment:
    if: >
      needs.preflight.outputs.event == 'pull_request'
      && (needs.preflight.outputs.is-fork == 'false'
          || needs.preflight.outputs.is-org-member == 'true')
      && needs.deploy-preview.outputs.deployed == 'true'
      && inputs.disable-comments != true
    needs:
      - preflight
      - build
      - deploy-preview
      - pre-comment
    runs-on: ubuntu-latest
    permissions:
      contents: none
      deployments: none
      id-token: none
      pull-requests: write
    steps:
      - name: Comment on PR
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
          PATH_PREFIX: ${{ needs.build.outputs.path_prefix }}
        with:
          # language=js
          script: |
            const title = '## 🔍 Preview links for changed docs'
            const { owner, repo } = context.repo;
            const prNumber = parseInt(process.env.PR_NUMBER);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber
            });

            const changedMdFiles = files
              .map(f => f.filename)
              .filter(i => i.endsWith('.md'))
              .filter(i => !i.includes('/_snippets/'));

            if (changedMdFiles.length === 0) return;

            const escapeMarkdown = (s) => s.replace(/([[\]()\\])/g, '\\$1');
            const toMarkdownLink = (file) => {
              const path = file
                .replace(/^docs\//, '')
                .replace(/\/index.md$/, '')
                .replace(/\.md$/, '');
              return `[${escapeMarkdown(file)}](https://docs-v3-preview.elastic.dev${process.env.PATH_PREFIX}/${path})`;
            }

            const links = changedMdFiles.map(toMarkdownLink)

            const body = [
              title,
              ...links.slice(0, 10).map(i => `- ${i}`),
            ]

            if (links.length > 10) {
              body.push('<details>');
              body.push('<summary> More links … </summary>');
              body.push('');
              for (const link of links.slice(10, 100)) {
                body.push(`- ${link}`);
              }
              body.push('');
              body.push('</details>');
            }

            if (links.length > 100) {
              body.push('');
              body.push(`<sub> In total, ${links.length} files changed. </sub>`);
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.startsWith(title)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body: body.join('\n'),
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body: body.join('\n'),
              });
            }

      - name: Comment on docs changes about versioning requirements
        if: inputs.enable-cumulative-comment == true
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
        with:
          # language=js
          script: |
            const prNum = parseInt(process.env.PR_NUMBER);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNum
            });

            const title = '## ℹ️ Important: Docs version tagging';

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.startsWith(title)
            );

            if (existingComment) return;

            const body = `${title}

            👋 Thanks for updating the docs! Just a friendly reminder that our docs are now **cumulative**. This means all 9.x versions are documented on the same page and published off of the main branch, instead of creating separate pages for each minor version.

            We use [applies_to tags](https://elastic.github.io/docs-builder/syntax/applies) to mark version-specific features and changes.

            <details>
            <summary>Expand for a quick overview</summary>

            ### When to use applies_to tags:
            ✅ At the page level to indicate which products/deployments the content applies to (mandatory)
            ✅ When features change state (e.g. preview, ga) in a specific version
            ✅ When availability differs across deployments and environments

            ### What NOT to do:
            ❌ Don't remove or replace information that applies to an older version
            ❌ Don't add new information that applies to a specific version without an applies_to tag
            ❌ Don't forget that applies_to tags can be used at the page, section, and inline level

            </details>

            ### 🤔 Need help?
            - Check out the [cumulative docs guidelines](https://www.elastic.co/docs/contribute-docs/how-to/cumulative-docs/)
            - Reach out in the [#docs](https://elastic.slack.com/archives/C0JF80CJZ) Slack channel`;

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: prNum,
              body
            });

  vale-report:
    if: >
      needs.preflight.outputs.event == 'pull_request'
      && needs.preflight.outputs.content-source-match == 'true'
      && (needs.preflight.outputs.is-fork == 'false'
          || needs.preflight.outputs.is-org-member == 'true')
      && inputs.enable-vale-linting == true
      && needs.preflight.outputs.vale-files-match == 'true'
    needs:
      - preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: none
      pull-requests: write
    steps:
      - name: Check Vale results artifact
        id: vale-artifact
        uses: actions/github-script@v9
        with:
          # language=js
          script: |
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });
            const found = artifacts.some(artifact =>
              artifact.name === 'vale-results' && artifact.expired === false
            );

            core.setOutput('found', found ? 'true' : 'false');
            if (!found) {
              core.notice(`Vale report skipped: no vale-results artifact found for workflow run ${runId}`);
            }

      - name: Post Vale Results
        if: steps.vale-artifact.outputs.found == 'true'
        uses: elastic/docs-actions/vale/report@v1

  # Uploads links.json to the shared link index S3 bucket.
  # Runs concurrently with deploy-preview — both depend only on build.
  # Requires links_uploaded == 'true' to confirm the build produced and uploaded
  # the links artifact before attempting download.
  update-link-index:
    if: >
      needs.build.outputs.links_uploaded == 'true'
      && needs.preflight.outputs.content-source-match == 'true'
      && needs.preflight.outputs.link-index-eligible == 'true'
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      REF_NAME: ${{ needs.preflight.outputs.head-branch }}
    steps:
      - name: Generate AWS Role ARN
        id: role_arn
        shell: python
        # language=python
        run: |
          import hashlib
          import os

          prefix = "elastic-docs-link-index-uploader-"
          m = hashlib.sha256()
          m.update(os.environ["GITHUB_REPOSITORY"].encode('utf-8'))
          hash = m.hexdigest()[:64-len(prefix)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"result=arn:aws:iam::197730964718:role/{prefix}{hash}")

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ steps.role_arn.outputs.result }}
          aws-region: us-east-1

      - name: Download links artifact
        uses: actions/download-artifact@v8
        with:
          name: links
          path: /tmp/link-index-upload

      - name: Reject symlinks in link index artifact
        run: |
          if find /tmp/link-index-upload -type l | grep -q .; then
            echo "::error::Symlinks found in link index artifact — refusing to upload"
            find /tmp/link-index-upload -type l -ls
            exit 1
          fi

      - name: Upload link reference to S3
        run: |
          aws s3 cp --checksum-algorithm "SHA256" \
            "/tmp/link-index-upload/links.json" \
            "s3://elastic-docs-link-index/${GITHUB_REPOSITORY}/${REF_NAME}/links.json"
