name: Release notes changelog file

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to changelog.yml configuration file'
        type: string
        default: 'docs/changelog.yml'
      comment-only:
        description: 'Post changelog as a PR comment instead of committing to the branch'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-notes-changelog-file-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
      && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: none
      pull-requests: read
      id-token: write
    outputs:
      should-submit: ${{ steps.evaluate.outputs.should-submit }}
      is-org-member: ${{ steps.check-org-membership.outputs.is-member }}
      pr-number: ${{ steps.pr-author.outputs.pr-number }}
    steps:
      - name: Resolve PR author
        id: pr-author
        if: github.event.workflow_run.head_repository.full_name != github.repository
        uses: actions/github-script@v9
        with:
          # language=js
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            let prNumber;
            if (run.pull_requests?.length > 0) {
              prNumber = run.pull_requests[0].number;
            } else {
              const headLabel = `${run.head_repository.owner.login}:${run.head_branch}`;
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: headLabel
              });
              const match = prs.find(pr => pr.head.sha === run.head_sha);
              if (match) prNumber = match.number;
            }

            if (!prNumber) {
              core.setFailed('Could not resolve PR number for fork — cannot verify org membership. Failing closed.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber
            });
            core.setOutput('login', pr.user.login);
            core.setOutput('pr-number', String(prNumber));

      - name: Fetch ephemeral GitHub token
        if: github.event.workflow_run.head_repository.full_name != github.repository
        id: fetch-ephemeral-token
        uses: elastic/ci-gh-actions/fetch-github-token@v1.5.3
        with:
          vault-instance: "ci-prod"
          vault-role: "token-policy-a71b1f2b88ec"

      - name: Check org membership
        id: check-org-membership
        if: github.event.workflow_run.head_repository.full_name != github.repository
        uses: elastic/docs-actions/github/is-elastic-org-member@v1
        with:
          username: ${{ steps.pr-author.outputs.login }}
          token: ${{ steps.fetch-ephemeral-token.outputs.token }}

      - name: Evaluate
        id: evaluate
        env:
          IS_FORK: ${{ github.event.workflow_run.head_repository.full_name != github.repository }}
          IS_ORG_MEMBER: ${{ steps.check-org-membership.outputs.is-member }}
        # language=bash
        run: |
          if [[ "$IS_FORK" == "true" && "$IS_ORG_MEMBER" != "true" ]]; then
            echo "should-submit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Changelog submit skipped — fork PRs from non-members are not processed"
          else
            echo "should-submit=true" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: preflight
    if: needs.preflight.outputs.should-submit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.evaluate.outputs.proceed }}
    steps:
      - name: Evaluate and generate changelog
        id: evaluate
        uses: elastic/docs-actions/changelog/submit/evaluate@v1
        with:
          config: ${{ inputs.config }}
          # For same-repo PRs the fork-only org-membership steps are skipped,
          # so the output is empty. Default to 'false' to ensure it is never
          # interpreted as 'true'.
          is-org-member: ${{ needs.preflight.outputs.is-org-member || 'false' }}
          comment-only: ${{ inputs.comment-only }}

  apply:
    needs: [preflight, generate]
    if: needs.generate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Apply changelog
        uses: elastic/docs-actions/changelog/submit/apply@v1
        with:
          config: ${{ inputs.config }}

  fork-guidance:
    needs: preflight
    if: >
      needs.preflight.outputs.should-submit == 'false'
      && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post fork contributor guidance
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
          CONFIG: ${{ inputs.config }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (!prNumber) {
              core.warning('Could not resolve PR number — skipping fork guidance comment');
              return;
            }

            const config = process.env.CONFIG || 'docs/changelog.yml';
            const repoName = process.env.REPO_NAME;
            const changelogDir = config.includes('/') ? config.replace(/\/[^/]+$/, '') : '.';
            const entryPath = `${changelogDir}/${prNumber}.yaml`;

            const bashScript = [
              `mkdir -p ${changelogDir}`,
              `cat > "${entryPath}" << 'YAML'`,
              `pr: ${prNumber}`,
              `type: enhancement  # feature | enhancement | bug-fix | breaking-change`,
              `title: Describe your change clearly`,
              `products:`,
              `  - product: ${repoName}`,
              `YAML`,
              `git add "${entryPath}"`,
              `git commit -m "Add changelog entry for PR #${prNumber}"`,
              `git push`,
            ].join('\n');

            const docsBuilderSnippet = [
              `CHANGELOG_PR_NUMBER=${prNumber} \\`,
              `CHANGELOG_TITLE="Describe your change clearly" \\`,
              `CHANGELOG_TYPE="enhancement" \\`,
              `CHANGELOG_OWNER=${context.repo.owner} \\`,
              `CHANGELOG_REPO=${repoName} \\`,
              `  docs-builder changelog add \\`,
              `    --concise \\`,
              `    --config ${config} \\`,
              `    --output ${changelogDir}`,
              `git add "${entryPath}"`,
              `git commit -m "Add changelog entry for PR #${prNumber}"`,
              `git push`,
            ].join('\n');

            const marker = '<!-- changelog-fork-guidance -->';
            const body = [
              marker,
              '## Changelog entry required',
              '',
              `This repository requires a changelog entry for every labeled PR. As an external contributor your entry cannot be auto-committed — please add \`${entryPath}\` to your branch.`,
              '',
              '### Option 1 — create the file manually (no tooling required)',
              '',
              '```bash',
              bashScript,
              '```',
              '',
              '### Option 2 — generate with `docs-builder`',
              '',
              '```bash',
              docsBuilderSnippet,
              '```',
              '',
              `Adjust \`type\` and \`title\` to match your change, then push. The changelog validation will re-run automatically.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
