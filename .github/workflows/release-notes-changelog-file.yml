name: Release notes changelog file

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to changelog.yml configuration file'
        type: string
        default: 'docs/changelog.yml'
      comment-only:
        description: 'Post changelog as a PR comment instead of committing to the branch'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-notes-changelog-file-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
      && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: none
      pull-requests: read
      id-token: write
    outputs:
      should-submit: ${{ steps.evaluate.outputs.should-submit }}
      is-org-member: ${{ steps.check-org-membership.outputs.is-member }}
      pr-number: ${{ steps.pr-author.outputs.pr-number }}
    steps:
      - name: Resolve PR author
        id: pr-author
        if: github.event.workflow_run.head_repository.full_name != github.repository
        uses: actions/github-script@v9
        with:
          # language=js
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            let prNumber;
            if (run.pull_requests?.length > 0) {
              prNumber = run.pull_requests[0].number;
            } else {
              const headLabel = `${run.head_repository.owner.login}:${run.head_branch}`;
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: headLabel
              });
              const match = prs.find(pr => pr.head.sha === run.head_sha);
              if (match) prNumber = match.number;
            }

            if (!prNumber) {
              core.setFailed('Could not resolve PR number for fork — cannot verify org membership. Failing closed.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber
            });
            core.setOutput('login', pr.user.login);
            core.setOutput('pr-number', String(prNumber));

      - name: Fetch ephemeral GitHub token
        if: github.event.workflow_run.head_repository.full_name != github.repository
        id: fetch-ephemeral-token
        uses: elastic/ci-gh-actions/fetch-github-token@v1.5.3
        with:
          vault-instance: "ci-prod"
          vault-role: "token-policy-a71b1f2b88ec"

      - name: Check org membership
        id: check-org-membership
        if: github.event.workflow_run.head_repository.full_name != github.repository
        uses: elastic/docs-actions/github/is-elastic-org-member@v1
        with:
          username: ${{ steps.pr-author.outputs.login }}
          token: ${{ steps.fetch-ephemeral-token.outputs.token }}

      - name: Evaluate
        id: evaluate
        env:
          IS_FORK: ${{ github.event.workflow_run.head_repository.full_name != github.repository }}
          IS_ORG_MEMBER: ${{ steps.check-org-membership.outputs.is-member }}
        # language=bash
        run: |
          if [[ "$IS_FORK" == "true" && "$IS_ORG_MEMBER" != "true" ]]; then
            echo "should-submit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Changelog submit skipped — fork PRs from non-members are not processed"
          else
            echo "should-submit=true" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: preflight
    if: needs.preflight.outputs.should-submit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.evaluate.outputs.proceed }}
    steps:
      - name: Evaluate and generate changelog
        id: evaluate
        uses: elastic/docs-actions/changelog/submit/evaluate@v1
        with:
          config: ${{ inputs.config }}
          # For same-repo PRs the fork-only org-membership steps are skipped,
          # so the output is empty. Default to 'false' to ensure it is never
          # interpreted as 'true'.
          is-org-member: ${{ needs.preflight.outputs.is-org-member || 'false' }}
          comment-only: ${{ inputs.comment-only }}

  apply:
    needs: [preflight, generate]
    if: needs.generate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Apply changelog
        uses: elastic/docs-actions/changelog/submit/apply@v1
        with:
          config: ${{ inputs.config }}

  fork-guidance:
    needs: preflight
    if: >
      needs.preflight.outputs.should-submit == 'false'
      && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Check if fork guidance is needed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::warning::Could not resolve PR number — skipping fork guidance artifact"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Download the changelog-decision artifact from the triggering release-notes run to
          # determine whether the PR is specifically failing the require-changelog-file gate.
          # Only upload fork guidance when the file is confirmed missing — not for label failures
          # or skip PRs, which are already handled by the release-notes workflow.
          if ! gh run download "${RUN_ID}" --repo "${REPO}" --name changelog-decision --dir /tmp/trigger-decision 2>/dev/null; then
            echo "No changelog-decision artifact in triggering run — skipping fork guidance"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS=$(jq -r '.status // ""' /tmp/trigger-decision/metadata.json 2>/dev/null || echo "")
          GATE=$(jq -r '.gate // ""' /tmp/trigger-decision/metadata.json 2>/dev/null || echo "")

          if [[ "$STATUS" == "missing-entry" && "$GATE" == "file" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write fork-guidance decision artifact
        if: steps.check.outputs.needed == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
          CONFIG: ${{ inputs.config }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          CHANGELOG_DIR="${CONFIG%/*}"
          [[ "$CHANGELOG_DIR" == "$CONFIG" ]] && CHANGELOG_DIR="."
          mkdir -p .artifacts/changelog-decision
          jq -n \
            --argjson pr_number "${PR_NUMBER}" \
            --arg head_ref "${HEAD_REF}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg head_repo "${HEAD_REPO}" \
            --arg changelog_dir "${CHANGELOG_DIR}" \
            --arg config_file "${CONFIG}" \
            '{
              pr_number: $pr_number,
              head_ref: $head_ref,
              head_sha: $head_sha,
              head_repo: $head_repo,
              status: "missing-entry",
              is_fork: true,
              can_commit: false,
              maintainer_can_modify: false,
              gate: "file",
              changelog_dir: $changelog_dir,
              config_file: $config_file
            }' > .artifacts/changelog-decision/metadata.json

      - name: Upload fork-guidance decision artifact
        if: steps.check.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-decision
          path: .artifacts/changelog-decision
          if-no-files-found: warn
          retention-days: 1
