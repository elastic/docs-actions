name: Release notes

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to changelog.yml configuration file'
        type: string
        default: docs/changelog.yml
      bundle-on-release:
        description: 'Run the bundle job when a GitHub release is published'
        type: boolean
        default: false
      require-changelog-file:
        description: 'Require a changelog file to be present in the PR (evaluate-pr gate)'
        type: boolean
        default: false
      require-impact-action:
        description: 'Require breaking-change PRs to have Impact and Action sections in the description (evaluate-pr gate)'
        type: boolean
        default: false
      comment-on-success:
        description: 'Also comment when the checks pass, saying whether the PR will be part of the release notes and why'
        type: boolean
        default: false
permissions: {}

concurrency:
  group: release-notes-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  # Drafts skip validation, so they get no failing check and no PR comment. GitHub cannot merge a draft,
  # so the skip never lets a PR through. The caller listens for ready_for_review to validate it then.
  validate:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: elastic/docs-actions/docs-builder/setup@v1
        with:
          version: edge

      # Label-only gate — no GitHub API call needed
      - name: Validate labels
        run: |
          IS_FORK="${{ github.event.pull_request.head.repo.full_name != github.repository }}"
          FORK_FLAG=""
          if [ "$IS_FORK" = "true" ]; then FORK_FLAG="--is-fork"; fi
          CAN_COMMIT_FLAG="--can-commit"
          if [ "$IS_FORK" = "true" ] && [ "${{ github.event.pull_request.maintainer_can_modify }}" != "true" ]; then
            CAN_COMMIT_FLAG=""
          fi
          MAINTAINER_FLAG=""
          if [ "${{ github.event.pull_request.maintainer_can_modify }}" = "true" ]; then
            MAINTAINER_FLAG="--maintainer-can-modify"
          fi
          COMMENT_FLAG=""
          if [ "$COMMENT_ON_SUCCESS" = "true" ]; then COMMENT_FLAG="--comment-on-success"; fi
          docs-builder changelog validate-labels \
            --config "$CONFIG" \
            --pr-labels "$PR_LABELS" \
            --pr-number "$PR_NUMBER" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --head-repo "$HEAD_REPO" \
            $FORK_FLAG $CAN_COMMIT_FLAG $MAINTAINER_FLAG $COMMENT_FLAG
        env:
          COMMENT_ON_SUCCESS: ${{ inputs.comment-on-success }}
          CONFIG: ${{ inputs.config }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

      # Entry-file gate — validates any changelog/*.yml files the PR added or modified
      - name: Validate changelog entry files
        run: |
          COMMENT_FLAG=""
          if [ "$COMMENT_ON_SUCCESS" = "true" ]; then COMMENT_FLAG="--comment-on-success"; fi
          docs-builder changelog validate "$PR_NUMBER" \
            --config "$CONFIG" \
            --owner "$REPO_OWNER" \
            --repo "$REPO_NAME" \
            --pr-labels "$PR_LABELS" \
            $COMMENT_FLAG
        env:
          COMMENT_ON_SUCCESS: ${{ inputs.comment-on-success }}
          GITHUB_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      # Changelog-file and Impact/Action gates — only run when an input is enabled
      - name: Evaluate PR
        if: inputs.require-changelog-file || inputs.require-impact-action
        run: |
          GATE_FLAGS=()
          if [ "$REQUIRE_CHANGELOG_FILE" = "true" ]; then GATE_FLAGS+=(--require-changelog-file); fi
          if [ "$REQUIRE_IMPACT_ACTION" = "true" ]; then GATE_FLAGS+=(--require-impact-action); fi
          # Without these flags evaluate-pr skips an "edited" event, so adding the missing sections would never clear the gate.
          if [ "$TITLE_CHANGED" = "true" ]; then GATE_FLAGS+=(--title-changed); fi
          if [ "$BODY_CHANGED" = "true" ]; then GATE_FLAGS+=(--body-changed); fi
          if [ "$COMMENT_ON_SUCCESS" = "true" ]; then GATE_FLAGS+=(--comment-on-success); fi
          docs-builder changelog evaluate-pr \
            --config "$CONFIG" \
            --owner "$REPO_OWNER" \
            --repo "$REPO_NAME" \
            --pr-number "$PR_NUMBER" \
            --pr-title "$PR_TITLE" \
            --pr-labels "$PR_LABELS" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --event-action "$EVENT_ACTION" \
            --strip-title-prefix \
            "${GATE_FLAGS[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          # The PR body is untrusted: pass it through the environment, never interpolate it into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENT_ON_SUCCESS: ${{ inputs.comment-on-success }}
          REQUIRE_CHANGELOG_FILE: ${{ inputs.require-changelog-file }}
          REQUIRE_IMPACT_ACTION: ${{ inputs.require-impact-action }}
          TITLE_CHANGED: ${{ github.event.changes.title != null }}
          BODY_CHANGED: ${{ github.event.changes.body != null }}

      - name: Upload decision artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changelog-decision
          path: .artifacts/changelog-decision
          retention-days: 1
          if-no-files-found: ignore

  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: elastic/docs-actions/docs-builder/setup@v1
        with:
          version: edge

      - name: Upload changelogs and amends
        uses: elastic/docs-actions/changelog/upload@v1
        with:
          config: ${{ inputs.config }}
          artifact-type: changelog,amend
          branch: ${{ github.ref_name }}

  bundle:
    if: github.event_name == 'release' && inputs.bundle-on-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      bundle-path: ${{ steps.create.outputs.bundle-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create bundle
        id: create
        uses: elastic/docs-actions/changelog/bundle-create-version@v1
        with:
          config: ${{ inputs.config }}
          version: ${{ github.event.release.tag_name }}
          repo: ${{ github.event.repository.name }}
          owner: ${{ github.repository_owner }}

  bundle-publish:
    if: github.event_name == 'release' && inputs.bundle-on-release
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish bundle to S3
        uses: elastic/docs-actions/changelog/bundle-publish@v1
        with:
          config: ${{ inputs.config }}
          bundle-path: ${{ needs.bundle.outputs.bundle-path }}
