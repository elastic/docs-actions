name: create-major-tag

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: create-major-tag
  cancel-in-progress: false

jobs:
  create-major-tag:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Validate and extract major version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' does not match expected semver format (N.N.N)"
            exit 1
          fi
          echo "MAJOR_VERSION=${TAG%%.*}" >> "${GITHUB_ENV}"

      - name: Create major tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag "v${MAJOR_VERSION}"
          git push -f origin "refs/tags/v${MAJOR_VERSION}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

  notify-failure:
    needs: [create-major-tag]
    if: always() && needs.create-major-tag.result == 'failure'
    runs-on: ubuntu-slim
    permissions:
      id-token: write
    steps:
      - uses: elastic/docs-actions/slack/notify-status@v1
        with:
          channel: docs-alerts
          status: failure
          mention: S028C66K5EX
          description: Failed to create or update the floating major tag after release publish.
