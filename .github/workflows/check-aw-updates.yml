name: Check gh-aw updates

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly on Mondays at 9am UTC
  workflow_dispatch:

jobs:
  check-updates:
    name: Recompile lock files and open PR if changed
    runs-on: ubuntu-latest
    env:
      GH_AW_VERSION: v0.86.2
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Create ephemeral GitHub token
        id: create-token
        uses: elastic/oblt-actions/github/create-token@v1.39.4
        with:
          token-policy: token-policy-8749eaab83f2

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.create-token.outputs.token }}
          persist-credentials: false

      - name: Install gh-aw and compile
        run: |
          gh extension install github/gh-aw --pin "$GH_AW_VERSION"
          gh aw compile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        # create-pull-request no-ops when the working tree has no changes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.create-token.outputs.token }}
          commit-message: |
            Update gh-aw lock files

            Automated recompilation of gh-aw workflow lock files.
          branch: automated/gh-aw-update
          title: Update gh-aw lock files
          body: |
            Automated weekly check detected updated gh-aw lock files after recompilation with `${{ env.GH_AW_VERSION }}`.

            Review the lock file diffs to verify the changes are expected.
          labels: automation
