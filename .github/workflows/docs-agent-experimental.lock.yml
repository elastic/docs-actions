          GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
          GH_AW_SAFE_OUTPUT_MESSAGES: "{\"runStarted\":\"🧪 [docs-agent-experimental]({run_url}) is analyzing this issue. This comment will be updated when the run finishes.\",\"runSuccess\":\"✅ [docs-agent-experimental]({run_url}) finished processing this issue.\",\"runFailure\":\"❌ [docs-agent-experimental]({run_url}) could not complete this issue. Open the run for details.\",\"pullRequestCreated\":\"✅ Draft pull request created: [#{item_number}]({item_url})\"}"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
