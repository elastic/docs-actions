name: "docs-agent-experimental"
on:
  issues:
    types:
      - labeled
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      issue_number:
        description: Issue number to process
        required: true
        type: string
    outputs:
      comment_id:
        description: ID of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_id }}
      comment_url:
        description: URL of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_url }}
      created_pr_number:
        description: Number of the first created pull request
        value: ${{ jobs.safe_outputs.outputs.created_pr_number }}
      created_pr_url:
        description: URL of the first created pull request
        value: ${{ jobs.safe_outputs.outputs.created_pr_url }}
    secrets:
      GH_AW_CI_TRIGGER_TOKEN:
        required: false
      GH_AW_DEFAULT_OTLP_HEADERS:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false
      GH_AW_PLUGINS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      issue_number:
        description: Issue number to process
        required: true
        type: string

permissions: {}

concurrency:
  cancel-in-progress: false
  group: docs-agent-experimental-${{ github.event.issue.number || inputs.issue_number || github.run_id }}

run-name: "docs-agent-experimental"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.docs-agent-experimental
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=docs-agent-experimental,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

jobs:
  activation:
    needs: pre_activation
    if: needs.pre_activation.outputs.activated == 'true'
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      discussions: write
      issues: write
      pull-requests: write
    env:
      GH_AW_MAX_DAILY_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS || '5000' }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      artifact_prefix: ${{ steps.artifact-prefix.outputs.prefix }}
      body: ${{ steps.sanitized.outputs.body }}
      comment_id: ${{ steps.add-comment.outputs.comment-id }}
      comment_repo: ${{ steps.add-comment.outputs.comment-repo }}
      comment_url: ${{ steps.add-comment.outputs.comment-url }}
      daily_ai_credits_exceeded: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_exceeded == 'true' }}
      daily_ai_credits_guardrail_status: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_guardrail_status || '' }}
      daily_ai_credits_threshold: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_threshold || '' }}
      daily_ai_credits_total_effective_tokens: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_total_effective_tokens || '' }}
      engine_id: ${{ steps.generate_aw_info.outputs.engine_id }}
      lockdown_check_failed: ${{ steps.generate_aw_info.outputs.lockdown_check_failed == 'true' }}
      model: ${{ steps.generate_aw_info.outputs.model }}
      oauth_token_check_failed: ${{ steps.check-oauth-tokens.outputs.oauth_token_check_failed == 'true' }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      stale_lock_file_failed: ${{ steps.check-lock-file.outputs.stale_lock_file_failed == 'true' }}
      text: ${{ steps.sanitized.outputs.text }}
      title: ${{ steps.sanitized.outputs.title }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@bc8c008a419c5b7a29df6f5641edd35fd1c6ea85 # v0.87.10
