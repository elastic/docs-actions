      - name: Add comment with workflow run link
        id: add-comment
        if: github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' || github.event_name == 'discussion' || github.event_name == 'discussion_comment' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_WORKFLOW_NAME: "docs-agent-experimental"
          GH_AW_WORKFLOW_EMOJI: "🧪"
          GH_AW_SAFE_OUTPUT_MESSAGES: "{\"runStarted\":\"🧪 [docs-agent-experimental]({run_url}) is analyzing this issue. This comment will be updated when the run finishes.\",\"runSuccess\":\"✅ [docs-agent-experimental]({run_url}) finished processing this issue.\",\"runFailure\":\"❌ [docs-agent-experimental]({run_url}) could not complete this issue. Open the run for details.\",\"pullRequestCreated\":\"✅ Draft pull request created: [#{item_number}]({item_url})\"}"
        with:
