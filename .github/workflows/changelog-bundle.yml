name: Changelog bundle

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to changelog.yml configuration file'
        type: string
        default: 'docs/changelog.yml'
      release-version:
        description: >
          GitHub release tag used as the PR filter source (e.g. v9.2.0).
          Mutually exclusive with report.
        type: string
      report:
        description: >
          Buildkite promotion report URL or local file path.
          Mutually exclusive with release-version.
        type: string
      output:
        description: 'Output file path for the bundle (e.g. docs/releases/v9.2.0.yaml)'
        type: string
        required: true
      repo:
        description: 'GitHub repository name; falls back to bundle.repo in changelog.yml'
        type: string
      owner:
        description: 'GitHub repository owner; falls back to bundle.owner in changelog.yml, then elastic'
        type: string

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: elastic/docs-actions/changelog/bundle@v1
        with:
          config: ${{ inputs.config }}
          release-version: ${{ inputs.release-version }}
          report: ${{ inputs.report }}
          output: ${{ inputs.output }}
          repo: ${{ inputs.repo }}
          owner: ${{ inputs.owner }}
          github-token: ${{ github.token }}
