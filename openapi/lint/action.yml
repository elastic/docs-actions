name: 'Elastic OpenAPI Linter'
description: 'Lint an OpenAPI 2.0 (Swagger), 3.0, or 3.1 spec against the centralized Elastic ruleset (Redocly)'
author: 'Elastic'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  spec-path:
    description: 'Repo-relative path to the OpenAPI spec file (JSON or YAML)'
    required: true
  fail-on-warn:
    description: 'Fail the check on warning-level convention issues, not just errors'
    required: false
    default: 'false'

outputs:
  error-count:
    description: 'Number of error-level results'
    value: ${{ steps.lint.outputs.error-count }}
  warning-count:
    description: 'Number of warning-level results'
    value: ${{ steps.lint.outputs.warning-count }}
  results-file:
    description: 'Path to the Redocly JSON results file'
    value: ${{ steps.lint.outputs.results-file }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
      run: |
        set -euo pipefail

        if [ -z "${SPEC_PATH}" ]; then
          echo "::error::spec-path is required"
          exit 1
        fi

        if [ ! -f "${SPEC_PATH}" ]; then
          echo "::error::spec-path not found: ${SPEC_PATH}"
          exit 1
        fi

        if [[ "${SPEC_PATH}" == /* ]]; then
          echo "::warning::spec-path is absolute (${SPEC_PATH}); PR annotations may not anchor to a file. Use a repo-relative path."
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'

    - name: Install Redocly CLI
      shell: bash
      run: npm ci --prefix "${{ github.action_path }}"

    - name: Run Redocly
      id: lint
      shell: bash
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
        FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
      run: |
        set -euo pipefail

        RESULTS="${RUNNER_TEMP}/redocly-results.json"
        STDERR="${RUNNER_TEMP}/redocly-stderr.log"
        HAS_JSON=true
        EXIT=0

        "${{ github.action_path }}/node_modules/.bin/redocly" lint \
          --config="${{ github.action_path }}/redocly.yaml" \
          --lint-config=error \
          --format=json \
          --max-problems=10000 \
          "${SPEC_PATH}" > "${RESULTS}" 2> "${STDERR}" || EXIT=$?

        # Redocly doesn't produce JSON when it cannot parse or recognize the
        # document. Normalize that case to the ordinary results schema.
        if [ ! -s "${RESULTS}" ] || ! jq -e '.totals and .problems' "${RESULTS}" > /dev/null 2>&1; then
          HAS_JSON=false
          while IFS= read -r line; do
            echo "${line}"
          done < "${STDERR}"
          jq -n --arg ref "${SPEC_PATH}" '{
            totals: {errors: 1, warnings: 0, ignored: 0},
            problems: [{
              ruleId: "redocly-processing-error",
              severity: "error",
              message: "Redocly could not process this API description. See the step log for details.",
              location: [{source: {ref: $ref}, pointer: "#/"}],
              suggest: []
            }]
          }' > "${RESULTS}"
          echo "::error file=${SPEC_PATH}::Redocly could not process this API description. See the step log for details."
          EXIT=1
        fi

        ERROR_COUNT="$(jq -r '.totals.errors' "${RESULTS}")"
        WARNING_COUNT="$(jq -r '.totals.warnings' "${RESULTS}")"

        # JSON is needed for outputs and the summary. Run the GitHub formatter
        # separately because Redocly accepts only one output format per run.
        if [ "${HAS_JSON}" == "true" ]; then
          "${{ github.action_path }}/node_modules/.bin/redocly" lint \
            --config="${{ github.action_path }}/redocly.yaml" \
            --lint-config=error \
            --format=github-actions \
            --max-problems=10000 \
            "${SPEC_PATH}" || true
        fi

        if [ "${ERROR_COUNT}" -gt 0 ]; then
          EXIT=1
        elif [ "${FAIL_ON_WARN}" == "true" ] && [ "${WARNING_COUNT}" -gt 0 ]; then
          EXIT=1
        fi

        echo "error-count=${ERROR_COUNT}" >> "$GITHUB_OUTPUT"
        echo "warning-count=${WARNING_COUNT}" >> "$GITHUB_OUTPUT"
        echo "results-file=${RESULTS}" >> "$GITHUB_OUTPUT"
        echo "exit-code=${EXIT}" >> "$GITHUB_OUTPUT"

    - name: Write job summary and enforce result
      if: always()
      shell: bash
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
        RESULTS_FILE: ${{ steps.lint.outputs.results-file }}
        ERROR_COUNT: ${{ steps.lint.outputs.error-count }}
        WARNING_COUNT: ${{ steps.lint.outputs.warning-count }}
        EXIT_CODE: ${{ steps.lint.outputs.exit-code }}
      run: |
        set -euo pipefail

        if [ -f "${RESULTS_FILE}" ]; then
          {
            echo "## OpenAPI Lint: ${SPEC_PATH}"
            echo ""
            echo "**Errors:** ${ERROR_COUNT} · **Warnings:** ${WARNING_COUNT}"
            echo ""
            if [ "$((ERROR_COUNT + WARNING_COUNT))" -gt 0 ]; then
              echo "| Severity | Rule | Location | Message |"
              echo "|---|---|---|---|"
              jq -r '.problems[] |
                "| " + .severity +
                " | " + (.ruleId // "redocly") +
                " | `" + (.location[0].pointer // "#/") + "`" +
                " | " + (.message | gsub("[\\r\\n]+"; " ") | gsub("\\|"; "\\|")) + " |"
              ' "${RESULTS_FILE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "${EXIT_CODE}" != "0" ]; then
          exit 1
        fi
