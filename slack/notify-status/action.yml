name: slack/notify-status
description: |
  Post a color-coded Slack status notification for the current GitHub job or workflow.
  Requires `permissions: id-token: write` in the calling workflow.

inputs:
  channel:
    description: Slack channel ID or name
    required: true
  status:
    description: Status to report (success, failure, cancelled, or skipped). Defaults to the current job status when omitted.
    required: false
    default: ''
  mention:
    description: Optional Slack user ID, subteam ID, or formatted mention token to include in the message
    required: false
    default: ''
  description:
    description: Optional reason or summary shown above the workflow metadata
    required: false
    default: ''
  fail-on-error:
    description: Fail the step when Slack delivery fails
    required: false
    default: 'false'

outputs:
  success:
    description: Whether the message was posted successfully
    value: ${{ steps.notify.outputs.success }}
  channel:
    description: Slack channel ID from the posted message
    value: ${{ steps.notify.outputs.channel }}
  ts:
    description: Slack message timestamp for threaded replies
    value: ${{ steps.notify.outputs.ts }}

runs:
  using: composite
  steps:
    - name: Build status message
      id: format
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        STATUS: ${{ inputs.status != '' && inputs.status || job.status }}
        MENTION: ${{ inputs.mention }}
        DESCRIPTION: ${{ inputs.description }}
        REPOSITORY: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
        REF: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        EVENT_NAME: ${{ github.event_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        script: |
          const { buildStatusMessage } = require('${{ github.action_path }}/scripts/format-status.js');
          const message = buildStatusMessage({
            status: process.env.STATUS,
            mention: process.env.MENTION,
            description: process.env.DESCRIPTION,
            repository: process.env.REPOSITORY,
            workflow: process.env.WORKFLOW,
            ref: process.env.REF,
            actor: process.env.ACTOR,
            eventName: process.env.EVENT_NAME,
            runUrl: process.env.RUN_URL,
          });
          core.setOutput('text', message.text);
          core.setOutput('attachments', JSON.stringify(message.attachments));

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
      with:
        aws-region: eu-west-1
        role-to-assume: arn:aws:iam::197730964718:role/elastic-docs-slack-notifier-invoker

    - name: Post status to Slack
      id: notify
      shell: bash
      env:
        LAMBDA_ARN: arn:aws:lambda:eu-west-1:197730964718:function:elastic-docs-slack-notifier
        SLACK_CHANNEL: ${{ inputs.channel }}
        SLACK_TEXT: ${{ steps.format.outputs.text }}
        SLACK_ATTACHMENTS: ${{ steps.format.outputs.attachments }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: bash "${{ github.action_path }}/../scripts/post-to-slack.sh"
