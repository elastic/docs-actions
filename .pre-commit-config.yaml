---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '\.lock\.yml$'
      - id: end-of-file-fixer
        exclude: '\.lock\.yml$'
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: '(\.lock\.yml$|^\.github/workflows/agentics-maintenance\.yml$)'

  - repo: https://github.com/reakaleek/gh-action-readme
    rev: v0.7.1
    hooks:
      - id: action-readme
        verbose: true

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        exclude: '(\.lock\.yml$|^\.github/workflows/agentics-maintenance\.yml$)'

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: compile-workflows
        name: compile gh-aw workflows
        language: system
        entry: ./scripts/run-gh-aw-compile.sh
        files: '^\.gh-aw-version$|\.github/workflows/gh-aw-.*\.md$|\.github/workflows/gh-aw-fragments/'
        pass_filenames: false
